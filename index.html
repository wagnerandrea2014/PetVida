<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#4FB3C4" />
<title>PetVida — Cuide bem do seu melhor amigo</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
input,select,textarea{outline:none}
ul{margin:0;padding:0;list-style:none}
:root{
  --bg:#F0F6F8;--card:#FFFFFF;--txt:#1B2434;--muted:#7B879C;--line:#E4EEF2;
  --primary:#4FB3C4;--primary-d:#2A8A99;--primary-soft:#E0F4F8;
  --secondary:#25C2B0;--secondary-soft:#E4F8F5;
  --accent:#E89B4E;--accent-soft:#FFF2E0;
  --danger:#E63946;--danger-soft:#FFE5E8;
  --blue:#4A7DFF;--blue-soft:#EAF0FF;
  --purple:#9B5DE5;--purple-soft:#F3EAFE;
  --radius:20px;--radius-sm:14px;
  --shadow:0 6px 22px rgba(27,36,52,.07);
  --shadow-lg:0 14px 40px rgba(27,36,52,.16);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --tab-h: 68px;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.app-header{position:relative;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 16px;background:linear-gradient(140deg,#5EC0D0 0%,#4FB3C4 55%,#2A8A99 100%);color:#fff;border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(42,138,153,.28);flex-shrink:0}
.app-header::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.10)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;backdrop-filter:blur(6px)}
.hdr-logo svg{width:22px;height:22px;fill:#fff}
.hdr-title{font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.1;display:flex;align-items:center;gap:6px}
.hdr-version{font-size:9.5px;font-weight:800;background:rgba(255,255,255,.25);padding:2.5px 6px;border-radius:6px;letter-spacing:.3px}
.hdr-sub{font-size:11.5px;opacity:.85;font-weight:500}
.hdr-actions{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.20);display:grid;place-items:center;backdrop-filter:blur(6px);transition:transform .15s ease;position:relative;cursor:pointer}
.icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.32)}
.icon-btn svg{width:19px;height:19px;fill:#fff}
.icon-btn .badge-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#25C2B0;border:2px solid rgba(255,255,255,.9)}
.icon-btn.cloud-on{background:rgba(74,222,128,.30)}
.icon-btn.cloud-sync{background:rgba(255,176,32,.35);animation:pulseCloud 1.4s infinite}
@keyframes pulseCloud{0%,100%{opacity:1}50%{opacity:.6}}
.hdr-stats{display:flex;gap:9px;margin-top:14px;position:relative;z-index:2}
.stat{flex:1;background:rgba(255,255,255,.17);border-radius:14px;padding:9px 10px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16)}
.stat-n{font-size:17px;font-weight:800;line-height:1}
.stat-l{font-size:10px;opacity:.88;margin-top:3px;font-weight:600;letter-spacing:.2px}
.swiper{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--tab-h) + var(--safe-b) + 26px);scrollbar-width:none;display:none}
.page.active{display:block;animation:pageSlide .3s cubic-bezier(.32,.72,.28,1)}
.page.chat-page{padding:0 0 calc(var(--tab-h) + var(--safe-b))}
@keyframes pageSlide{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
.page::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;align-items:stretch;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);box-shadow:0 -6px 22px rgba(27,36,52,.06)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9AA6B8;position:relative;transition:color .2s ease;padding-top:6px;cursor:pointer}
.tab svg{width:18px;height:18px;fill:currentColor;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.tab span{font-size:8.5px;font-weight:700;letter-spacing:.1px}
.tab.active{color:var(--primary)}
.tab.active svg{transform:translateY(-2px) scale(1.1)}
.tab.active::after{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:0 0 4px 4px;background:var(--primary)}
.tab.ia-tab.active{color:#9B5DE5}
.tab.ia-tab.active::after{background:#9B5DE5}
.tab.ia-tab .ia-dot{position:absolute;top:8px;right:calc(50% - 14px);width:6px;height:6px;border-radius:50%;background:#9B5DE5;animation:pulse2 2s infinite}
@keyframes pulse2{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.2)}}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}
.sec-head:first-child{margin-top:2px}
.sec-title{font-size:15.5px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:7px}
.sec-title .dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.sec-link{font-size:12px;font-weight:700;color:var(--primary);padding:4px 0}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;border:1px solid rgba(228,238,242,.9)}
.empty-hero{background:linear-gradient(140deg,#FFFFFF,#F0FAFC);border:1.5px dashed #B8E3EB;border-radius:var(--radius);padding:26px 20px;text-align:center;box-shadow:var(--shadow)}
.empty-emoji{font-size:44px;line-height:1;margin-bottom:10px;display:block}
.empty-hero h3{margin:0 0 6px;font-size:16px;font-weight:800}
.empty-hero p{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-size:14px;font-weight:800;transition:transform .13s ease;width:100%;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#5EC0D0,#2A8A99);color:#fff;box-shadow:0 8px 20px rgba(42,138,153,.30)}
.btn-ghost{background:var(--primary-soft);color:var(--primary-d)}
.btn-soft{background:#F1F4F9;color:var(--txt)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-purple{background:linear-gradient(135deg,#9B5DE5,#B585F0);color:#fff;box-shadow:0 8px 20px rgba(155,93,229,.30)}
.btn-success{background:linear-gradient(135deg,#25C2B0,#4AD4C3);color:#fff;box-shadow:0 8px 20px rgba(37,194,176,.30)}
.btn-sm{padding:10px 15px;font-size:12.5px;width:auto;border-radius:12px}
.btn svg{width:17px;height:17px;fill:currentColor}
.pet-card{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:var(--radius);padding:13px;box-shadow:var(--shadow);margin-bottom:11px;border:1px solid rgba(228,238,242,.9);transition:transform .14s ease;position:relative;overflow:hidden;cursor:pointer}
.pet-card:active{transform:scale(.985)}
.pet-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--primary),var(--accent))}
.pet-avatar{width:54px;height:54px;border-radius:17px;flex-shrink:0;display:grid;place-items:center;font-size:27px;background:linear-gradient(140deg,#DDF0F4,#C8E8EE);box-shadow:inset 0 -2px 6px rgba(42,138,153,.10);overflow:hidden}
.pet-avatar.cat{background:linear-gradient(140deg,#DDF6F2,#C6EFE9)}
.pet-avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.pet-info{flex:1;min-width:0}
.pet-name{font-size:15px;font-weight:800;letter-spacing:-.2px}
.pet-meta{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet-badges{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.badge{font-size:9.5px;font-weight:800;padding:3.5px 8px;border-radius:8px;letter-spacing:.2px;text-transform:uppercase}
.badge-ok{background:var(--secondary-soft);color:#12897A}
.badge-warn{background:var(--accent-soft);color:#B47800}
.badge-late{background:var(--danger-soft);color:#C42B50}
.badge-info{background:var(--blue-soft);color:#3157C9}
.badge-purple{background:var(--purple-soft);color:#6B31B8}
.badge-neutro{background:#F1F4F9;color:#66738A}
.pet-chevron{color:#C7CFDD;flex-shrink:0}
.fab{position:fixed;right:18px;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);width:56px;height:56px;border-radius:19px;z-index:35;background:linear-gradient(135deg,#5EC0D0,#2A8A99);display:grid;place-items:center;box-shadow:0 12px 28px rgba(42,138,153,.42);cursor:pointer}
.fab svg{width:26px;height:26px;fill:#fff}
.next-card{background:linear-gradient(140deg,#FFFFFF,#F0F9FB);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid #C8E8EE;display:flex;gap:13px;align-items:flex-start;cursor:pointer}
.next-card.alerta{background:linear-gradient(140deg,#FFFFFF,#FFF0F2);border-color:#FFD5DC}
.next-icon{width:46px;height:46px;border-radius:15px;flex-shrink:0;display:grid;place-items:center;background:var(--primary-soft);font-size:21px}
.next-card.alerta .next-icon{background:var(--danger-soft)}
.next-body{flex:1;min-width:0}
.next-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--primary-d)}
.next-card.alerta .next-label{color:var(--danger)}
.next-title{font-size:14.5px;font-weight:800;margin-top:3px;letter-spacing:-.2px}
.next-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.next-date{font-size:11px;font-weight:800;margin-top:7px;color:var(--primary-d)}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.quick{background:var(--card);border-radius:var(--radius-sm);padding:13px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--shadow);border:1px solid rgba(228,238,242,.9);cursor:pointer}
.quick:active{transform:scale(.94)}
.quick-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.quick span{font-size:9.5px;font-weight:800;color:#4C5768;text-align:center;line-height:1.2}
.tip-card{background:linear-gradient(135deg,#1F2A3D,#2B3A52);border-radius:var(--radius);padding:17px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tip-tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:rgba(255,255,255,.16);padding:4px 9px;border-radius:8px;margin-bottom:9px}
.tip-card h4{margin:0 0 6px;font-size:14.5px;font-weight:800}
.tip-card p{margin:0;font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.82)}
.search-wrap{position:relative;margin-bottom:13px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;fill:#A9B3C4}
.search-input{width:100%;padding:13px 14px 13px 41px;border-radius:15px;background:var(--card);border:1.5px solid var(--line);font-size:13.5px;font-weight:600;box-shadow:var(--shadow)}
.search-input:focus{border-color:var(--primary)}
.seg{display:flex;gap:5px;background:#E4EEF2;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 8px;border-radius:11px;font-size:12.5px;font-weight:800;color:#7B879C;cursor:pointer}
.seg button.active{background:#fff;color:var(--primary-d);box-shadow:0 3px 10px rgba(27,36,52,.10)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:13px;scrollbar-width:none;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:11px;font-size:12px;font-weight:700;background:var(--card);border:1.5px solid var(--line);color:#66738A;cursor:pointer}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 5px 14px rgba(79,179,196,.32)}
.subnav{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:10px;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}
.subnav::-webkit-scrollbar{display:none}
.subnav-btn{flex-shrink:0;padding:9px 14px;border-radius:12px;font-size:11.5px;font-weight:800;background:#fff;border:1.5px solid var(--line);color:#66738A;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.subnav-btn.active{background:linear-gradient(135deg,#5EC0D0,#2A8A99);border-color:transparent;color:#fff}
.breed-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.breed-card{background:var(--card);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(228,238,242,.9);text-align:left;cursor:pointer}
.breed-top{height:110px;display:grid;place-items:center;position:relative;overflow:hidden}
.breed-top svg.raca-svg{width:100%;height:100%;display:block}
.breed-top .breed-emoji-badge{position:absolute;top:8px;left:8px;font-size:14px;background:rgba(255,255,255,.92);width:26px;height:26px;border-radius:9px;display:grid;place-items:center;z-index:2}
.breed-porte{position:absolute;top:8px;right:8px;font-size:8.5px;font-weight:800;background:rgba(255,255,255,.92);color:#5A6478;padding:3px 7px;border-radius:7px;text-transform:uppercase;z-index:2}
.breed-body{padding:10px 11px 12px}
.breed-name{font-size:12.5px;font-weight:800;line-height:1.25}
.breed-sub{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600}
.timeline{position:relative;padding-left:30px}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:14px;width:2px;background:linear-gradient(180deg,#B8E3EB,#E4EEF2);border-radius:2px}
.tl-item{position:relative;margin-bottom:13px}
.tl-node{position:absolute;left:-30px;top:14px;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #D8DFEA;display:grid;place-items:center}
.tl-node svg{width:11px;height:11px;fill:#fff;opacity:0}
.tl-item.ok .tl-node{background:var(--secondary);border-color:var(--secondary)}
.tl-item.ok .tl-node svg{opacity:1}
.tl-item.atrasada .tl-node{background:var(--danger);border-color:var(--danger)}
.tl-item.proxima .tl-node{border-color:var(--accent);background:var(--accent-soft)}
.vac-card{background:var(--card);border-radius:var(--radius-sm);padding:13px;box-shadow:var(--shadow);border:1px solid rgba(228,238,242,.9)}
.tl-item.ok .vac-card{border-color:#D3F0EB;background:linear-gradient(140deg,#fff,#F6FDFB)}
.tl-item.atrasada .vac-card{border-color:#FFD5DC;background:linear-gradient(140deg,#fff,#FFF7F9)}
.vac-head{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}
.vac-name{font-size:13.5px;font-weight:800;line-height:1.3}
.vac-obs{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.vac-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px;flex-wrap:wrap}
.vac-date{font-size:11px;font-weight:800;color:#5A6478}
.vac-marca{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;background:var(--purple-soft);color:#6B31B8;padding:4px 8px;border-radius:7px;margin-top:6px}
.vac-intervalo{font-size:9.5px;font-weight:800;background:#EAF0FF;color:#3157C9;padding:2px 6px;border-radius:6px}
.check-btn{width:30px;height:30px;border-radius:10px;flex-shrink:0;border:2px solid #D8DFEA;display:grid;place-items:center;cursor:pointer}
.check-btn svg{width:15px;height:15px;fill:#fff;opacity:0}
.check-btn.done{background:var(--secondary);border-color:var(--secondary)}
.check-btn.done svg{opacity:1}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:13px;background:var(--card);border-radius:var(--radius-sm);margin-bottom:9px;box-shadow:var(--shadow);border:1px solid rgba(228,238,242,.9);cursor:pointer}
.check-item.done{background:linear-gradient(140deg,#fff,#F6FDFB);border-color:#D3F0EB}
.check-box{width:23px;height:23px;border-radius:8px;flex-shrink:0;margin-top:1px;border:2px solid #D8DFEA;display:grid;place-items:center}
.check-box svg{width:13px;height:13px;fill:#fff;opacity:0}
.check-item.done .check-box{background:var(--secondary);border-color:var(--secondary)}
.check-item.done .check-box svg{opacity:1}
.check-txt{flex:1}
.check-txt h5{margin:0;font-size:13px;font-weight:800}
.check-item.done .check-txt h5{color:#7B879C;text-decoration:line-through}
.check-txt p{margin:4px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:110px;padding:12px 4px 0;margin-bottom:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,#7DD0DE,#4FB3C4);min-height:6px}
.bar-lbl{font-size:9.5px;font-weight:800;color:var(--muted)}
.bar-val{font-size:10px;font-weight:800;color:var(--primary-d)}
.food-card{background:var(--card);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);margin-bottom:11px;border:1px solid rgba(228,238,242,.9)}
.food-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.food-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--accent-soft);flex-shrink:0}
.food-head h4{margin:0;font-size:14px;font-weight:800}
.food-head p{margin:3px 0 0;font-size:11px;color:var(--muted);font-weight:600}
.food-list li{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.5;color:#4C5768}
.food-list li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:7px}
.food-brand{display:inline-block;font-size:10.5px;font-weight:800;color:var(--primary-d);background:var(--primary-soft);padding:4px 9px;border-radius:8px;margin:4px 5px 0 0}
.empty{text-align:center;padding:42px 24px;color:var(--muted)}
.empty .e-ic{font-size:42px;display:block;margin-bottom:12px;opacity:.75}
.empty h4{margin:0 0 6px;font-size:14.5px;font-weight:800;color:var(--txt)}
.empty p{margin:0;font-size:12.5px;line-height:1.6}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(19,25,38,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .26s ease;display:flex;align-items:flex-end}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-height:92vh;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,.28,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-backdrop.open .modal{transform:translateY(0)}
.modal-grab{padding:9px 0 4px;display:flex;justify-content:center;flex-shrink:0}
.modal-grab::after{content:"";width:38px;height:4.5px;border-radius:3px;background:#D5DCE8}
.modal-head{padding:6px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.modal-head h3{margin:0;font-size:18px;font-weight:800}
.modal-head p{margin:3px 0 0;font-size:12px;color:var(--muted);font-weight:600}
.modal-close{width:34px;height:34px;border-radius:12px;background:#E4EEF2;display:grid;place-items:center;flex-shrink:0;cursor:pointer}
.modal-close svg{width:16px;height:16px;fill:#66738A}
.modal-body{flex:1;overflow-y:auto;padding:0 20px 20px;-webkit-overflow-scrolling:touch}
.modal-foot{padding:13px 20px calc(20px + var(--safe-b));background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;flex-shrink:0}
.field{margin-bottom:15px}

.next-prod .np-info{font-size:12.5px;font-weight:800;color:#1B2434;margin-top:4px;line-height:1.4}
.next-prod .np-data{font-size:11px;font-weight:800;color:#12897A;margin-top:5px}
.next-prod.late{background:linear-gradient(140deg,#FFF0F4,#FFE5E8);border-color:#FFD5DC}
.next-prod.late .np-ic{background:linear-gradient(135deg,#E63946,#C42B50)}
.next-prod.late .np-titulo{color:#C42B50}
.next-prod.late .np-data{color:#C42B50}
.gasto-resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.gasto-res{background:linear-gradient(140deg,#F0F9FB,#E0F4F8);border:1.5px solid #C8E8EE;border-radius:16px;padding:14px;text-align:center}
.gasto-res-v{font-size:22px;font-weight:800;color:var(--primary-d);line-height:1}
.gasto-res-l{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;margin-top:5px;letter-spacing:.3px}
.gasto-item{background:#fff;border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);border:1px solid rgba(228,238,242,.9);margin-bottom:8px;display:flex;gap:11px;align-items:center;position:relative}
.gasto-cat{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-size:17px}
.gasto-body{flex:1;min-width:0}
.gasto-desc{font-size:12.5px;font-weight:800;color:#1B2434}
.gasto-meta{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:3px}
.gasto-valor{font-size:14px;font-weight:800;color:var(--danger);flex-shrink:0}
.gasto-del{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:8px;background:#F8FAFD;display:grid;place-items:center;color:#C7CFDD;cursor:pointer}
.gasto-del svg{width:12px;height:12px;fill:currentColor}
.compra-item{background:#fff;border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);border:1px solid rgba(228,238,242,.9);margin-bottom:8px;display:flex;gap:11px;align-items:center}
.compra-check{width:24px;height:24px;border-radius:8px;border:2px solid #D8DFEA;flex-shrink:0;display:grid;place-items:center;cursor:pointer}
.compra-check svg{width:14px;height:14px;fill:#fff;opacity:0}
.compra-item.done .compra-check{background:var(--secondary);border-color:var(--secondary)}
.compra-item.done .compra-check svg{opacity:1}
.compra-body{flex:1}
.compra-nome{font-size:13px;font-weight:800}
.compra-item.done .compra-nome{color:#7B879C;text-decoration:line-through}
.compra-qtd{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
.compra-del{width:26px;height:26px;border-radius:9px;background:#F8FAFD;display:grid;place-items:center;color:#C7CFDD;cursor:pointer;flex-shrink:0}
.compra-del svg{width:13px;height:13px;fill:currentColor}
.racao-card{display:flex;gap:12px;background:#fff;border-radius:var(--radius-sm);padding:11px;box-shadow:var(--shadow);border:1px solid rgba(228,238,242,.9);margin-bottom:10px;position:relative;overflow:hidden}
.racao-card.top1{border-color:#F4D57E;background:linear-gradient(140deg,#fff,#FFFBEB)}
.racao-card.top2{border-color:#D5DCE8;background:linear-gradient(140deg,#fff,#F7F8FB)}
.racao-card.top3{border-color:#E8C8A0;background:linear-gradient(140deg,#fff,#FDF7F0)}
.racao-rank{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;background:rgba(255,255,255,.92);box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:2}
.racao-foto{width:70px;height:70px;border-radius:12px;overflow:hidden;flex-shrink:0;background:linear-gradient(140deg,#FFF2E0,#FFE0B8);display:grid;place-items:center;font-size:32px;position:relative}
.racao-foto img{width:100%;height:100%;object-fit:cover;display:block}
.racao-foto.img-fail img{display:none}
.racao-foto.img-fail::after{content:attr(data-emoji);font-size:32px;position:absolute;inset:0;display:grid;place-items:center}
.racao-body{flex:1;min-width:0}
.racao-marca{font-size:10px;font-weight:800;color:var(--primary-d);text-transform:uppercase;letter-spacing:.4px}
.racao-nome{font-size:12.5px;font-weight:800;color:#1B2434;line-height:1.3;margin-top:2px}
.racao-meta{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:4px;line-height:1.45}
.racao-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.racao-tag{font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:6px;text-transform:uppercase;letter-spacing:.2px}
.racao-tag.proteina{background:var(--secondary-soft);color:#12897A}
.racao-tag.porte{background:var(--blue-soft);color:#3157C9}
.racao-tag.idade{background:var(--purple-soft);color:#6B31B8}
.racao-tag.preco{background:var(--accent-soft);color:#B47800}
.racao-tag.destaque{background:linear-gradient(135deg,#F4D57E,#E8B848);color:#6B4A00}
.principio-ativo{font-size:10px;color:var(--muted);font-weight:700;margin-top:3px;line-height:1.4}
.apresentacao-tag{display:inline-block;font-size:9px;font-weight:800;background:var(--blue-soft);color:#3157C9;padding:2px 6px;border-radius:6px;margin-top:5px;text-transform:uppercase}
.idade-info-card{background:linear-gradient(140deg,#F3EAFE,#E9DDFB);border:1.5px solid #D9C4F5;border-radius:12px;padding:11px 13px;font-size:11.5px;font-weight:700;color:#6B31B8;line-height:1.5;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.idade-info-card .iic-ic{font-size:16px;flex-shrink:0}
.tipo-tratamento{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.tt-btn{padding:10px 6px;border-radius:12px;background:#F1F4F9;border:2px solid transparent;text-align:center;cursor:pointer}
.tt-btn.active{border-color:var(--primary);background:var(--primary-soft)}
.tt-btn .tt-em{display:block;font-size:18px;margin-bottom:3px}

function normalizarPet(p){
  if(!p.historico) p.historico = {consultas:[],exames:[],medicamentos:[],cirurgias:[],alergias:[]};
  if(!p.antipulgas) p.antipulgas = [];
  if(!p.vermifugos) p.vermifugos = [];
  if(!p.banhos) p.banhos = [];
  if(!p.diario) p.diario = [];
  if(!p.tutores) p.tutores = [];
  if(!p.vacinas) p.vacinas = {};
  if(!p.pesos) p.pesos = [];
  if(!p.cuidados) p.cuidados = [];
  if(!p.album) p.album = [];
  if(!p.gastos) p.gastos = [];
  if(!p.listaCompras) p.listaCompras = [];
  return p;
}
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(Array.isArray(d.pets)) state.pets = d.pets;
      if(d.ultimaAtualizacao) state.ultimaAtualizacao = d.ultimaAtualizacao;
    }
  }catch(e){ state.pets = []; }
  state.pets.forEach(normalizarPet);
}

function traduzErroAuth(msg){
  const m = {'EMAIL_EXISTS':'Este e-mail já está cadastrado','EMAIL_NOT_FOUND':'E-mail não encontrado','INVALID_PASSWORD':'Senha incorreta','INVALID_EMAIL':'E-mail inválido','WEAK_PASSWORD':'Senha muito fraca','INVALID_LOGIN_CREDENTIALS':'E-mail ou senha incorretos','TOO_MANY_ATTEMPTS_TRY_LATER':'Muitas tentativas. Aguarde','USER_DISABLED':'Conta desativada'};
  return m[msg] || msg || 'Erro ao autenticar';
}
async function fbLoginAnonimo(){
  const url = `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_CONFIG.apiKey}`;
  const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({returnSecureToken: true})});
  if(!res.ok){ const err = await res.json(); throw new Error(traduzErroAuth(err.error?.message)); }
  const data = await res.json();
  fbAuth = {uid: data.localId, idToken: data.idToken, email: null, refreshToken: data.refreshToken, expiresAt: Date.now() + (parseInt(data.expiresIn) - 60) * 1000, isAnonymous: true};
  saveFbAuth(); return fbAuth;
}
async function fbCriarConta(email, senha){
  const url = `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_CONFIG.apiKey}`;
  const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password: senha, returnSecureToken: true})});
  if(!res.ok){ const err = await res.json(); throw new Error(traduzErroAuth(err.error?.message)); }
  const data = await res.json();
  fbAuth = {uid: data.localId, idToken: data.idToken, email, refreshToken: data.refreshToken, expiresAt: Date.now() + (parseInt(data.expiresIn) - 60) * 1000, isAnonymous: false};
  saveFbAuth(); return fbAuth;
}
async function fbEntrar(email, senha){

  const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password: senha, returnSecureToken: true})});
  if(!res.ok){ const err = await res.json(); throw new Error(traduzErroAuth(err.error?.message)); }
  const data = await res.json();
  fbAuth = {uid: data.localId, idToken: data.idToken, email, refreshToken: data.refreshToken, expiresAt: Date.now() + (parseInt(data.expiresIn) - 60) * 1000, isAnonymous: false};
  saveFbAuth(); return fbAuth;
}
async function fbRefreshToken(){
  if(!fbAuth.refreshToken) return false;
  try{
    const url = `https://securetoken.googleapis.com/v1/token?key=${FIREBASE_CONFIG.apiKey}`;
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(fbAuth.refreshToken)}`});
    if(!res.ok) return false;
    const data = await res.json();
    fbAuth.idToken = data.id_token;
    fbAuth.refreshToken = data.refresh_token;
    fbAuth.expiresAt = Date.now() + (parseInt(data.expires_in) - 60) * 1000;
    saveFbAuth(); return true;
  }catch(e){ return false; }
}
function fbSair(){ fbAuth = {uid:null, idToken:null, email:null, refreshToken:null, expiresAt:0, isAnonymous:true}; saveFbAuth(); }
async function fbGarantirToken(){
  if(!fbAuth.uid) return false;
  if(Date.now() > fbAuth.expiresAt - 30000){
    const ok = await fbRefreshToken();
    if(!ok){ fbSair(); return false; }
  }
  return !!fbAuth.idToken;
}
function paraFirestore(valor){
  if(valor === null || valor === undefined) return {nullValue: null};
  if(typeof valor === 'string') return {stringValue: valor};
  if(typeof valor === 'number'){ if(Number.isInteger(valor)) return {integerValue: String(valor)}; return {doubleValue: valor}; }
  if(typeof valor === 'boolean') return {booleanValue: valor};
  if(Array.isArray(valor)) return {arrayValue: {values: valor.map(paraFirestore)}};
  if(typeof valor === 'object'){
    const fields = {};
    for(const k in valor){ if(valor[k] !== undefined) fields[k] = paraFirestore(valor[k]); }
    return {mapValue: {fields}};
  }
  return {nullValue: null};
}
function deFirestore(valor){
  if(!valor) return null;
  if('nullValue' in valor) return null;
  if('stringValue' in valor) return valor.stringValue;
  if('integerValue' in valor) return parseInt(valor.integerValue);
  if('doubleValue' in valor) return valor.doubleValue;
  if('booleanValue' in valor) return valor.booleanValue;
  if('timestampValue' in valor) return valor.timestampValue;
  if('arrayValue' in valor){ return (valor.arrayValue.values || []).map(deFirestore); }
  if('mapValue' in valor){
    const obj = {};
    const fields = valor.mapValue.fields || {};
    for(const k in fields) obj[k] = deFirestore(fields[k]);
    return obj;
  }
  return null;
}
function objetoParaFirestore(obj){
  const fields = {};
  for(const k in obj){ if(obj[k] !== undefined) fields[k] = paraFirestore(obj[k]); }
  return {fields};
}
function firestoreParaObjeto(doc){
  if(!doc || !doc.fields) return null;
  const obj = {};
  for(const k in doc.fields) obj[k] = deFirestore(doc.fields[k]);
  return obj;
}
function firestoreBaseUrl(){ return `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents`; }
async function fsSet(colecao, docId, data){
  if(!await fbGarantirToken()) throw new Error('Sessão expirada');
  const url = `${firestoreBaseUrl()}/${colecao}/${docId}`;
  const res = await fetch(url, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + fbAuth.idToken},
    body: JSON.stringify(objetoParaFirestore(data))
  });
  if(!res.ok){
    if(res.status === 401 || res.status === 403) throw new Error('Sem permissão. Verifique as regras do Firestore');
    throw new Error('Erro ' + res.status);
  }
  return await res.json();
}
async function fsGet(colecao, docId){
  if(!await fbGarantirToken()) throw new Error('Sessão expirada');
  const url = `${firestoreBaseUrl()}/${colecao}/${docId}`;
  const res = await fetch(url, {headers: {'Authorization': 'Bearer ' + fbAuth.idToken}});
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('Erro ' + res.status);
  return firestoreParaObjeto(await res.json());
}

async function enviarParaNuvem(silencioso){
  if(!fbAuth.uid){ if(!silencioso) toast('Conecte-se à nuvem primeiro'); return; }
  if(!navigator.onLine){ if(!silencioso) toast('Sem internet'); return; }
  const uid = fbAuth.uid;
  if(!silencioso) toast('☁️ Enviando...');
  $('#btnCloud').classList.add('cloud-sync');
  try{
    const petsSemAlbum = state.pets.map(p => { const c = {...p}; delete c.album; return c; });
    await fsSet(`users/${uid}/data`, 'pets', {pets: petsSemAlbum});
    const albuns = {};
    state.pets.forEach(p => { if(p.album && p.album.length > 0) albuns[p.id] = p.album; });
    await fsSet(`users/${uid}/data`, 'album', {albuns});
    await fsSet(`users/${uid}/data`, 'meta', {versao: APP_VERSION, ultimaAtualizacao: new Date().toISOString(), qtdPets: state.pets.length, email: fbAuth.email || 'anônimo'});
    fbSync.ultimoUpload = new Date().toISOString();
    saveFbSync();
    if(!silencioso) toast('✅ Enviado para nuvem!');
  }catch(e){
    console.error('Erro upload:', e);
    if(!silencioso) toast('❌ ' + e.message);
  }finally{
    $('#btnCloud').classList.remove('cloud-sync');
  }
}
async function baixarDaNuvem(silencioso){
  if(!fbAuth.uid){ if(!silencioso) toast('Conecte-se à nuvem primeiro'); return false; }
  if(!navigator.onLine){ if(!silencioso) toast('Sem internet'); return false; }
  const uid = fbAuth.uid;
  if(!silencioso) toast('☁️ Baixando...');
  $('#btnCloud').classList.add('cloud-sync');
  try{
    const petsDoc = await fsGet(`users/${uid}/data`, 'pets');
    const albumDoc = await fsGet(`users/${uid}/data`, 'album');
    if(!petsDoc || !petsDoc.pets || petsDoc.pets.length === 0){ if(!silencioso) toast('Nuvem vazia'); return false; }
    if(!silencioso){
      const ok = await confirmarAcao('Baixar da nuvem', 'Os dados locais serão substituídos pelos da nuvem. Continuar?');
      if(!ok) return false;
    }
    fazerBackupAutomatico('Pré-download');
    const albuns = (albumDoc && albumDoc.albuns) || {};
    const pets = petsDoc.pets.map(p => { p.album = albuns[p.id] || []; return normalizarPet(p); });
    state.pets = pets;
    state.petSelecionado = state.pets[0] ? state.pets[0].id : null;
    saveDB();
    renderPage(state.currentPage);
    atualizarHeader();
    fbSync.ultimoDownload = new Date().toISOString();
    saveFbSync();
    if(!silencioso) toast('✅ Baixado da nuvem!');
    return true;
  }catch(e){
    console.error('Erro download:', e);
    if(!silencioso) toast('❌ ' + e.message);
    return false;
  }finally{
    $('#btnCloud').classList.remove('cloud-sync');
  }
}
async function sincronizarInteligente(){
  if(!fbAuth.uid){ toast('Conecte-se à nuvem primeiro'); return; }
  if(!navigator.onLine){ toast('Sem internet'); return; }
  const uid = fbAuth.uid;
  toast('🔄 Analisando...');
  try{
    const meta = await fsGet(`users/${uid}/data`, 'meta');
    const temNuvem = meta && meta.qtdPets > 0;
    const temLocal = state.pets.length > 0;
    if(!temLocal && !temNuvem){ toast('Sem dados'); return; }
    if(temLocal && !temNuvem){ await enviarParaNuvem(false); return; }
    if(!temLocal && temNuvem){ await baixarDaNuvem(false); return; }
    const tsLocal = state.ultimaAtualizacao ? new Date(state.ultimaAtualizacao).getTime() : 0;
    const tsNuvem = meta.ultimaAtualizacao ? new Date(meta.ultimaAtualizacao).getTime() : 0;
    if(Math.abs(tsLocal - tsNuvem) < 60000){ toast('✅ Já sincronizado'); return; }
    if(tsLocal > tsNuvem){
      const ok = await confirmarAcao('Sync inteligente', 'O LOCAL é mais recente. Enviar para a nuvem?');
      if(ok) await enviarParaNuvem(false);
    } else {
      const ok = await confirmarAcao('Sync inteligente', 'A NUVEM é mais recente. Baixar para o local?');
      if(ok) await baixarDaNuvem(false);
    }
  }catch(e){
    console.error(e);
    toast('❌ Erro: ' + e.message);
  }
}

function confirmarAcao(titulo, msg){
  return new Promise(resolve=>{
    openModal(headPadrao(titulo, 'Confirme'),
      `<div style="padding:14px 0;text-align:center">
        <div style="font-size:44px;margin-bottom:10px">❓</div>
        <div style="font-size:13.5px;line-height:1.6;color:#4C5768">${esc(msg)}</div>
      </div>`,
      `<button class="btn btn-soft" onclick="resolveConfirm(false)">Cancelar</button>
       <button class="btn btn-primary" onclick="resolveConfirm(true)">Confirmar</button>`);
    window.__confirmResolve = resolve;
  });
}
function resolveConfirm(v){
  closeModal();
  if(window.__confirmResolve){ window.__confirmResolve(v); window.__confirmResolve = null; }
}
function getBackups(){ try{ const r = localStorage.getItem(BACKUP_KEY); if(!r) return []; const a = JSON.parse(r); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
function setBackups(arr){ try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(arr)); }catch(e){} }
function fazerBackupAutomatico(motivo){
  const backups = getBackups();
  const backup = {id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,5), data: new Date().toISOString(), motivo: motivo || 'Automático', qtdPets: state.pets.length, tamanho: JSON.stringify(state.pets).length, dados: JSON.parse(JSON.stringify(state.pets))};
  backups.unshift(backup);

function tempoRelativo(iso){

  const seg = Math.floor(diff/1000);

  const horas = Math.floor(min/60);
  const dias = Math.floor(horas/24);
  if(seg < 60) return 'Agora mesmo';
  if(min < 60) return min + ' min atrás';
  if(horas < 24) return horas + 'h atrás';
  if(dias === 1) return 'Ontem';

function diffDias(a, b){ return Math.round((a - b) / 86400000); }
function calcIdade(nascimento){
  if(!nascimento) return '—';
  const nasc = new Date(nascimento + 'T12:00:00');
  if(isNaN(nasc)) return '—';
  const hoje = new Date();
  let meses = (hoje.getFullYear()-nasc.getFullYear())*12 + (hoje.getMonth()-nasc.getMonth());
  if(hoje.getDate() < nasc.getDate()) meses--;
  if(meses < 0) meses = 0;
  const anos = Math.floor(meses/12);
  const m = meses % 12;
  if(meses < 1){ const dias = Math.max(0, diffDias(hoje, nasc)); return dias + (dias === 1 ? ' dia' : ' dias'); }
  if(anos === 0) return m + (m===1?' mês':' meses');
  if(m === 0) return anos + (anos===1?' ano':' anos');
  return anos + 'a ' + m + 'm';
}
function idadeHumana(pet){
  if(!pet.nascimento) return '—';
  const nasc = new Date(pet.nascimento + 'T12:00:00');
  const hoje = new Date();
  let meses = (hoje.getFullYear()-nasc.getFullYear())*12 + (hoje.getMonth()-nasc.getMonth());
  if(hoje.getDate() < nasc.getDate()) meses--;
  if(meses < 0) meses = 0;
  const anos = meses / 12;
  let humano = 0;
  if(pet.especie === 'gato'){
    if(anos <= 1) humano = anos * 15;
    else if(anos <= 2) humano = 15 + (anos - 1) * 9;
    else humano = 24 + (anos - 2) * 4;
  } else {
    const p = parseFloat(String(pet.peso||'').replace(',','.')) || 0;
    let mult = 5;
    if(p < 10) mult = 4;
    else if(p < 25) mult = 5;
    else if(p < 45) mult = 6;
    else mult = 7;
    if(anos <= 1) humano = anos * 15;
    else if(anos <= 2) humano = 15 + (anos - 1) * 9;
    else humano = 24 + (anos - 2) * mult;
  }
  return Math.round(humano) + ' anos';
}
function faixaEtaria(nascimento){
  const nasc = new Date(nascimento + 'T12:00:00');
  const meses = (new Date().getFullYear()-nasc.getFullYear())*12 + (new Date().getMonth()-nasc.getMonth());
  if(meses < 2) return 'filhote';
  if(meses < 12) return 'junior';

  return 'senior';
}
function idadeDetalhada(pet){
  if(!pet.nascimento) return null;

  const hoje = new Date();
  let meses = (hoje.getFullYear()-nasc.getFullYear())*12 + (hoje.getMonth()-nasc.getMonth());
  if(hoje.getDate() < nasc.getDate()) meses--;
  if(meses < 0) meses = 0;
  const anos = Math.floor(meses/12);
  const mesesRestantes = meses % 12;
  let animalTxt = '';
  if(anos === 0 && mesesRestantes === 0){ const dias = Math.max(0, diffDias(hoje, nasc)); animalTxt = dias + (dias === 1 ? ' dia' : ' dias'); }
  else if(anos === 0){ animalTxt = mesesRestantes + (mesesRestantes === 1 ? ' mês' : ' meses'); }
  else if(mesesRestantes === 0){ animalTxt = anos + (anos === 1 ? ' ano' : ' anos'); }
  else { animalTxt = anos + (anos === 1 ? ' ano' : ' anos') + ' e ' + mesesRestantes + (mesesRestantes === 1 ? ' mês' : ' meses'); }
  return { meses, anos, mesesRestantes, animalTxt, humano: idadeHumana(pet), faixa: faixaEtaria(pet.nascimento) };
}

function padraoQr(pet, size){
  const s = size || 74;
  const seed = (pet.id||'x').split('').reduce((a,c)=>a+c.charCodeAt(0), 0);
  let cells = '';
  const n = 11;
  const c = s / n;
  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      const pseudo = Math.abs(Math.sin(seed + x*7 + y*13) * 10000) % 1;
      const isFinder = (x<3&&y<3)||(x>=n-3&&y<3)||(x<3&&y>=n-3);
      let fill = false;
      if(isFinder){ const fx = x<3?x:(x-(n-3)); const fy = y<3?y:(y-(n-3)); fill = !(fx===1 && fy===1); }
      else { fill = pseudo > 0.52; }
      if(fill) cells += `<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#1B2434"/>`;
    }
  }
  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" xmlns="http://www.w3.org/2000/svg" style="background:#fff;border-radius:4px">${cells}</svg>`;
}
function redimensionarImagem(dataUrl, maxSize, qualidade, cb){
  const img = new Image();
  img.onload = () => {
    let w = img.width, h = img.height;
    if(w > maxSize || h > maxSize){
      if(w > h){ h = Math.round(h * maxSize / w); w = maxSize; }
      else { w = Math.round(w * maxSize / h); h = maxSize; }
    }
    try{
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', qualidade));
    }catch(e){ cb(dataUrl); }
  };
  img.onerror = () => cb(dataUrl);
  img.src = dataUrl;
}

function getIntervaloProduto(nome, tabela){
  const t = tabela || PRODUTOS_ANTIPULGAS;
  if(t[nome]) return t[nome].intervalo;
  return 30;
}
function getIntervaloVermifugo(nome, pet){
  const info = PRODUTOS_VERMIFUGO[nome];
  if(!info) return 90;
  if(pet && pet.nascimento){
    const meses = idadeDetalhada(pet) ? idadeDetalhada(pet).meses : 99;
    if(meses < 6 && info.intervaloFilhote) return info.intervaloFilhote;
  }
  return info.intervalo;
}
function proximaAplicacaoProduto(lista, tabela, pet){
  if(!lista || lista.length === 0) return null;
  const ord = lista.slice().sort((a,b) => new Date(b.data) - new Date(a.data));
  const ult = ord[0];
  let intervalo;
  if(tabela === PRODUTOS_VERMIFUGO) intervalo = getIntervaloVermifugo(ult.produto, pet);
  else intervalo = getIntervaloProduto(ult.produto, tabela);
  const prox = addDays(new Date(ult.data + 'T12:00:00'), intervalo);
  const hoje = new Date(); hoje.setHours(12,0,0,0);
  const dias = diffDias(prox, hoje);
  return {produto: ult.produto, data: prox, dias, intervalo, status: dias < 0 ? 'late' : dias <= 7 ? 'warn' : 'ok'};
}

function racaoFotoHTML(r){
  const termo = r.esp === 'gato' ? 'cat-food-bag' : 'dog-food-bag';
  const url = `https://loremflickr.com/200/200/${encodeURIComponent(termo)},pet,${encodeURIComponent(r.marca.toLowerCase().replace(/[^a-z]/g,''))}`;
  const emoji = r.esp === 'gato' ? '🐱' : '🐶';
  return `<div class="racao-foto" data-emoji="${emoji}">
    <img src="${url}" alt="${esc(r.marca)}" loading="lazy" onerror="this.parentElement.classList.add('img-fail')">
  </div>`;
}
function filtrarRacoesParaPet(pet){
  const porte = pet.especie === 'gato' ? 'medio' : porteDoPet(pet);
  const faixa = faixaEtaria(pet.nascimento);
  const idadeAlvo = (faixa === 'junior') ? 'filhote' : faixa;
  let lista = RACOES_DB.filter(r => r.esp === pet.especie && r.porte === porte && r.idade === idadeAlvo);
  if(lista.length === 0) lista = RACOES_DB.filter(r => r.esp === pet.especie && r.idade === idadeAlvo);
  if(lista.length === 0) lista = RACOES_DB.filter(r => r.esp === pet.especie && r.idade === 'adulto');
  return lista.sort((a,b) => (b.destaque?1:0) - (a.destaque?1:0)).slice(0, 10);
}
function renderRacaoCard(r, index){
  const rankIcon = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index+1);
  const rankClass = index === 0 ? 'top1' : index === 1 ? 'top2' : index === 2 ? 'top3' : '';
  const porteLabel = r.porte === 'pequeno' ? 'Pequeno' : r.porte === 'medio' ? 'Médio' : 'Grande';
  const idadeLabel = {filhote:'Filhote', junior:'Júnior', adulto:'Adulto', senior:'Sênior'}[r.idade] || r.idade;
  return `<div class="racao-card ${rankClass}">
    <div class="racao-rank">${rankIcon}</div>
    ${racaoFotoHTML(r)}
    <div class="racao-body">
      <div class="racao-marca">${esc(r.marca)}</div>
      <div class="racao-nome">${esc(r.nome)}</div>
      <div class="racao-meta">Indicado: ${esc(r.indicacao)}<br>Embalagens: ${esc(r.peso)}</div>
      <div class="racao-tags">
        <span class="racao-tag proteina">💪 ${esc(r.proteina)}</span>
        <span class="racao-tag porte">${porteLabel}</span>
        <span class="racao-tag idade">${idadeLabel}</span>
        <span class="racao-tag preco">💰 ${esc(r.preco)}</span>
        ${r.destaque ? `<span class="racao-tag destaque">⭐ DESTAQUE</span>` : ''}
      </div>
    </div>
  </div>`;
}
function renderTopRacoesPet(pet){
  const lista = filtrarRacoesParaPet(pet);
  if(lista.length === 0) return '';
  const porteLabel = pet.especie === 'gato' ? 'Gato' : (porteDoPet(pet) === 'pequeno' ? 'Pequeno Porte' : porteDoPet(pet) === 'medio' ? 'Médio Porte' : 'Grande Porte');
  const faixa = faixaEtaria(pet.nascimento);
  const idadeLabel = {filhote:'Filhote', junior:'Júnior', adulto:'Adulto', senior:'Sênior'}[faixa];
  return `
    <div class="sec-head" style="margin-top:20px"><div class="sec-title"><span class="dot"></span>Top ${lista.length} rações para ${esc(pet.nome)}</div></div>
    <div class="calc-note" style="background:linear-gradient(140deg,#FFF9EC,#FFEFD0);border-color:#FFE4B5;color:#8A6420"><span class="cn-ic">🏆</span><div>Selecionadas por <strong>${porteLabel}</strong> · <strong>${idadeLabel}</strong>${pet.raca ? ' · '+esc(pet.raca) : ''}. Ranking baseado em popularidade no mercado brasileiro.</div></div>

}

function porteDoPet(pet){
  if(pet.peso){
    const p = parseFloat(String(pet.peso).replace(',','.'));
    if(pet.especie === 'cao'){
      if(p < 10) return 'pequeno';
      if(p < 25) return 'medio';
      return 'grande';
    }
  }
  return pet.especie === 'cao' ? 'medio' : 'pequeno';
}
function calcularRacao(pet){
  const peso = parseFloat(String(pet.peso || '').replace(',','.'));
  if(!peso || peso <= 0) return null;
  const rer = 70 * Math.pow(peso, 0.75);
  const faixa = faixaEtaria(pet.nascimento);
  let fator, refeicoes, obs;
  if(faixa === 'filhote'){
    const meses = idadeDetalhada(pet) ? idadeDetalhada(pet).meses : 3;
    if(meses < 4){ fator = 3.0; refeicoes = 4; obs = 'Filhote até 4 meses: 4 refeições'; }
    else { fator = 2.5; refeicoes = 3; obs = 'Filhote 4-6 meses: 3 refeições'; }
  } else if(faixa === 'junior'){ fator = 2.0; refeicoes = 3; obs = 'Júnior: 2-3 refeições'; }
  else if(faixa === 'adulto'){ fator = 1.6; refeicoes = 2; obs = 'Adulto: 2 refeições'; }
  else { fator = 1.4; refeicoes = 2; obs = 'Sênior: 2 refeições'; }
  if(pet.castrado === true) fator *= 0.9;
  const der = rer * fator;
  const kcalPorGrama = 3.7;
  const gramasDia = der / kcalPorGrama;
  const gramasPorRef = gramasDia / refeicoes;
  const agua = Math.round(peso * 60);
  return {rer: Math.round(rer), der: Math.round(der), gramasDia: Math.round(gramasDia), gramasPorRef: Math.round(gramasPorRef), refeicoes, obs, agua, kcalPorGrama};
}

function renderCurvaCrescimento(pet){
  const faixa = faixaEtaria(pet.nascimento);
  if(faixa === 'adulto' || faixa === 'senior') return '';
  const pesos = (pet.pesos || []).slice().sort((a,b) => new Date(a.data) - new Date(b.data));
  const padrao = padraoCrescimento(pet);
  if(pesos.length === 0){
    return `<div class="blk" style="background:linear-gradient(140deg,#F0F9FB,#E0F4F8);border-color:#C8E8EE"><h4><span class="b-ic">📏</span>Curva de crescimento</h4><p>Registre pesagens regularmente para acompanhar o crescimento de ${esc(pet.nome)}.</p></div>`;
  }
  const nasc = new Date(pet.nascimento + 'T12:00:00');
  const pontos = pesos.map(p => {
    const d = new Date(p.data + 'T12:00:00');
    const meses = Math.max(1, (d - nasc) / (1000 * 60 * 60 * 24 * 30.44));
    return {m: meses, kg: parseFloat(p.valor)};
  }).filter(x => x.m <= 13);
  const maxM = 12;
  const maxKg = Math.max(...Object.values(padrao), ...pontos.map(p => p.kg), 5) * 1.15;
  const W = 320, H = 180, PADL = 30, PADB = 24, PADT = 10, PADR = 10;
  const plotW = W - PADL - PADR, plotH = H - PADB - PADT;
  const xScale = m => PADL + (m / maxM) * plotW;
  const yScale = kg => PADT + plotH - (kg / maxKg) * plotH;
  let pathPadrao = '';
  const meses = Object.keys(padrao).map(Number).sort((a,b)=>a-b);
  meses.forEach((m, i) => {
    const x = xScale(m), y = yScale(padrao[m]);
    pathPadrao += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
  });
  let pathReal = '';
  pontos.forEach((p, i) => {
    const x = xScale(p.m), y = yScale(p.kg);
    pathReal += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
  });
  let circulos = pontos.map(p => `<circle cx="${xScale(p.m).toFixed(1)}" cy="${yScale(p.kg).toFixed(1)}" r="3.5" fill="#E89B4E" stroke="#fff" stroke-width="1.5"/>`).join('');
  let gridY = '';
  for(let i = 0; i <= 4; i++){
    const kg = (maxKg / 4) * i;
    const y = yScale(kg);
    gridY += `<line x1="${PADL}" y1="${y.toFixed(1)}" x2="${W-PADR}" y2="${y.toFixed(1)}" stroke="#E4EEF2" stroke-width="1"/>`;
    gridY += `<text x="${PADL-4}" y="${(y+3).toFixed(1)}" font-size="8" fill="#7B879C" text-anchor="end">${kg.toFixed(1)}</text>`;
  }
  let gridX = '';
  [1,3,6,9,12].forEach(m => {
    const x = xScale(m);
    gridX += `<line x1="${x.toFixed(1)}" y1="${PADT}" x2="${x.toFixed(1)}" y2="${H-PADB}" stroke="#F0F6F8" stroke-width="1"/>`;
    gridX += `<text x="${x.toFixed(1)}" y="${H-8}" font-size="8" fill="#7B879C" text-anchor="middle">${m}m</text>`;
  });
  const ultimo = pontos[pontos.length - 1];
  const idadeUlt = Math.round(ultimo.m);
  const esperado = padrao[idadeUlt] || padrao[12];
  let avalia = '';
  if(esperado && ultimo.kg > 0){
    const desvio = ((ultimo.kg - esperado) / esperado) * 100;
    if(desvio > 15) avalia = `<span style="color:#E63946;font-weight:800">↑ ${desvio.toFixed(0)}% acima do padrão — avaliar com vet</span>`;
    else if(desvio < -15) avalia = `<span style="color:#B47800;font-weight:800">↓ ${Math.abs(desvio).toFixed(0)}% abaixo do padrão — avaliar</span>`;
    else avalia = `<span style="color:#12897A;font-weight:800">✅ Dentro do esperado para ${idadeUlt} meses</span>`;
  }
  return `
    <div class="sec-head"><div class="sec-title"><span class="dot"></span>Curva de crescimento</div></div>
    <div class="growth-chart">
      <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        ${gridY}${gridX}
        <path d="${pathPadrao}" fill="none" stroke="#4FB3C4" stroke-width="2" stroke-dasharray="5 3" stroke-linecap="round"/>
        ${pathReal ? `<path d="${pathReal}" fill="none" stroke="#E89B4E" stroke-width="2.5" stroke-linecap="round"/>` : ''}
        ${circulos}
      </svg>
      <div class="growth-legend">
        <div class="gl"><div class="gl-dot" style="background:#4FB3C4"></div>Padrão</div>
        <div class="gl"><div class="gl-dot" style="background:#E89B4E"></div>${esc(pet.nome)}</div>
      </div>
    </div>
    ${avalia ? `<div class="calc-note" style="background:linear-gradient(140deg,#F6FDFB,#E4F8F5);border-color:#C7E8E2"><span class="cn-ic">📊</span><div>${avalia}</div></div>` : ''}`;
}

function processarPerguntaLocal(pergunta, petCtx){
  const t = (pergunta || '').toLowerCase().trim();
  if(!t) return null;
  const tokens = t.split(/\s+/);
  let melhor = null, melhorScore = 0;
  IA_KB.forEach(item=>{
    let score = 0;
    item.palavras.forEach(p=>{
      if(t.includes(p.toLowerCase())) score += (p.split(' ').length > 1 ? 2 : 1) * (item.peso || 1);
      else tokens.forEach(tk=>{ if(tk.length > 3 && p.toLowerCase().includes(tk)) score += 0.5 * (item.peso || 1); });
    });
    if(score > melhorScore){ melhorScore = score; melhor = item; }
  });
  if(!melhor || melhorScore < 1) return gerarRespostaGenerica(pergunta, petCtx);
  return {texto: melhor.resposta, tipo: melhor.tipo, fonte:'local'};
}
function gerarRespostaGenerica(pergunta, petCtx){
  let ctx = '';
  if(petCtx) ctx = `\n\n💡 **Sobre ${petCtx.nome}** (${petCtx.raca || 'SRD'}, ${petCtx.idade}):`;
  return {texto: `🤔 Não encontrei resposta específica. Tente conectar uma IA real (⚙️).\n\nPosso ajudar com:\n• 💉 Vacinação\n• 🍖 Alimentação\n• 🚑 Emergências\n• 🐕 Comportamento\n• 🩺 Saúde preventiva` + ctx, tipo: 'info', fonte: 'local'};
}

let modelosDisponiveisCache = null;
let cacheTimestamp = 0;
const CACHE_DURACAO = 10 * 60 * 1000;
let cotaEstado = {excedidaEm: 0, proximaTentativa: 0, tentativas: 0, groundingDesativado: false};
try{ const s = localStorage.getItem('petvida_cota'); if(s) cotaEstado = {...cotaEstado, ...JSON.parse(s)}; }catch(e){}
function saveCota(){ try{ localStorage.setItem('petvida_cota', JSON.stringify(cotaEstado)); }catch(e){} }

async function descobrirModelosDisponiveis(chaveLimpa){
  const agora = Date.now();
  if(modelosDisponiveisCache && (agora - cacheTimestamp) < CACHE_DURACAO) return modelosDisponiveisCache;
  try{
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models', {method:'GET', headers:{'x-goog-api-key': chaveLimpa}});
    if(!res.ok) return null;
    const data = await res.json();
    if(!data.models) return null;
    const modelos = data.models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent')).map(m => ({nome: m.name.replace('models/', '')}));
    modelosDisponiveisCache = modelos; cacheTimestamp = agora; return modelos;
  }catch(e){ return null; }
}
function ordenarModelosPorPreferencia(modelos){
  if(!modelos) return [];
  const prio = [
    {m:/^gemini-2\.0-flash$/,p:100},{m:/^gemini-2\.0-flash-lite$/,p:98},{m:/^gemini-2\.5-flash$/,p:95},
    {m:/^gemini-3\.6-flash$/,p:90},{m:/^gemini-3\.5-flash$/,p:85},{m:/^gemini-3\.1-pro$/,p:80},
    {m:/flash/i,p:30},{m:/pro/i,p:25},{m:/gemini/i,p:10}
  ];
  return modelos.slice().sort((a, b) => {
    const pa = prio.reduce((x, p) => p.m.test(a.nome) ? Math.max(x, p.p) : x, 0);
    const pb = prio.reduce((x, p) => p.m.test(b.nome) ? Math.max(x, p.p) : x, 0);
    return pb - pa;
  });
}
async function chamarIAReal(pergunta, petCtx){
  const cfg = iaConfig;
  if(!cfg.apiKey || cfg.provider === 'local') return null;
  const chaveLimpa = (cfg.apiKey || '').trim();
  if(!chaveLimpa) return null;
  if(cotaEstado.proximaTentativa > Date.now()){
    const falta = Math.ceil((cotaEstado.proximaTentativa - Date.now()) / 1000);
    return {erro: true, motivo: `Cota excedida. Aguarde ${falta}s`, statusCode: 429};
  }
  const sysPrompt = `Você é o Dr. Pet IA, assistente veterinário inteligente, amigável e completo.
- Responda em português do Brasil, com clareza e empatia
- Use **negrito** e listas quando ajudar
- Seja completo, responda até o fim
- ${cotaEstado.groundingDesativado ? 'Use conhecimento interno' : 'Você TEM pesquisa na internet — use quando precisar'}
- Em emergências, oriente veterinário IMEDIATAMENTE
- Termine com: "⚠️ Consulte um veterinário presencialmente."
${petCtx ? `\nPET: ${petCtx.nome} | ${petCtx.especie} | ${petCtx.raca || 'SRD'} | ${petCtx.idade} | ${petCtx.peso || '?'}kg` : ''}`;
  if(cfg.provider === 'openai' || cfg.provider === 'anthropic') return chamarIAProvedorAlternativo(pergunta, sysPrompt, chaveLimpa);
  let modelos = [];
  if(cfg.model && cfg.model.trim()) modelos.push(cfg.model.trim());
  const disp = await descobrirModelosDisponiveis(chaveLimpa);
  if(disp && disp.length > 0) ordenarModelosPorPreferencia(disp).forEach(m => { if(!modelos.includes(m.nome)) modelos.push(m.nome); });
  ['gemini-2.0-flash','gemini-2.0-flash-lite','gemini-2.5-flash','gemini-3.6-flash','gemini-1.5-flash-latest'].forEach(m => { if(!modelos.includes(m)) modelos.push(m); });
  const tentarGrounding = !cotaEstado.groundingDesativado;
  let ultimo = null, todos429 = true;
  for(const modelo of modelos){
    let r = await tentarChamarModelo(modelo, chaveLimpa, sysPrompt, pergunta, tentarGrounding);
    if(r && r.erro && r.statusCode === 400 && tentarGrounding) r = await tentarChamarModelo(modelo, chaveLimpa, sysPrompt, pergunta, false);
    if(r && r.erro && r.statusCode === 429){ ultimo = r; continue; }
    if(r && r.statusCode !== 429) todos429 = false;
    if(r && r.erro && (r.statusCode === 401 || r.statusCode === 403)) return r;
    if(r && r.erro){ ultimo = r; continue; }
    if(r && r.texto){
      if(iaConfig.model !== modelo){ iaConfig.model = modelo; saveIAConfig(); }
      cotaEstado.tentativas = 0; cotaEstado.groundingDesativado = false; saveCota();
      return r;
    }
  }
  if(todos429){
    cotaEstado.tentativas++;
    const backoff = Math.min(300, 15 * Math.pow(2, cotaEstado.tentativas - 1));
    cotaEstado.proximaTentativa = Date.now() + backoff * 1000;
    cotaEstado.groundingDesativado = true;
    saveCota();
    return {erro: true, motivo: `Cota excedida. Tente em ${backoff}s`, statusCode: 429};
  }
  return ultimo || {erro: true, motivo: 'Nenhum modelo disponível', statusCode: 404};
}
async function tentarChamarModelo(modelo, chaveLimpa, sysPrompt, pergunta, usarGrounding){
  try{
    const body = {
      contents: [{role:'user', parts:[{text: sysPrompt + '\n\n---\n\nPERGUNTA:\n' + pergunta}]}],
      generationConfig: {maxOutputTokens: 2500, temperature: 0.9, topP: 0.95, topK: 40},
      safetySettings: [
        {category:'HARM_CATEGORY_HARASSMENT',threshold:'BLOCK_NONE'},
        {category:'HARM_CATEGORY_HATE_SPEECH',threshold:'BLOCK_NONE'},
        {category:'HARM_CATEGORY_SEXUALLY_EXPLICIT',threshold:'BLOCK_NONE'},
        {category:'HARM_CATEGORY_DANGEROUS_CONTENT',threshold:'BLOCK_NONE'}
      ]
    };
    if(usarGrounding) body.tools = [{google_search: {}}];
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent`, {
      method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':chaveLimpa}, body: JSON.stringify(body)
    });
    if(res.status === 404) return {erro:true, motivo:'Modelo indisponível', statusCode:404};
    if(res.status === 429) return {erro:true, motivo:'Cota excedida', statusCode:429};
    if(res.status === 401 || res.status === 403) return {erro:true, motivo:'Chave inválida', statusCode:res.status};
    if(!res.ok) return {erro:true, motivo:'HTTP '+res.status, statusCode:res.status};
    const data = await res.json();
    let texto = '', finishReason = '', fontes = [];
    if(data.candidates && data.candidates[0]){
      const c = data.candidates[0];
      finishReason = c.finishReason || '';
      if(c.content && c.content.parts) texto = c.content.parts.map(p => p.text || '').join('');
      if(c.groundingMetadata && c.groundingMetadata.groundingChunks){
        fontes = c.groundingMetadata.groundingChunks.filter(x => x.web).map(x => ({titulo: (x.web.title || 'Fonte').replace(/[\[\]]/g,''), uri: x.web.uri || ''})).filter(f => f.uri);
      }
    }
    if(!texto) return {erro:true, motivo:'Resposta vazia', statusCode:200};
    let aviso = '';
    if(finishReason === 'MAX_TOKENS') aviso = '\n\n---\n_⚠️ Resposta longa cortada._';
    else if(finishReason === 'SAFETY') aviso = '\n\n---\n_⚠️ Conteúdo filtrado._';
    let textoFinal = texto.trim() + aviso;
    if(usarGrounding && fontes.length > 0){
      const lista = fontes.slice(0, 3).map(f => {
        let dom = ''; try{ dom = new URL(f.uri).hostname.replace('www.',''); }catch(e){}
        return `• [${f.titulo}](${f.uri})${dom ? ' — _'+dom+'_' : ''}`;
      }).join('\n');
      textoFinal += '\n\n**🔗 Fontes:**\n' + lista;
    }
    const emg = temEmergencia(pergunta);
    return {texto: textoFinal, tipo: emg ? 'emergencia' : 'ia-real', real: true, fonte: 'ia-real', modelo: modelo, comGrounding: usarGrounding && fontes.length > 0};
  }catch(e){ return {erro:true, motivo:'Rede: '+e.message, statusCode:0}; }
}
async function chamarIAProvedorAlternativo(pergunta, sysPrompt, chaveLimpa){
  const cfg = iaConfig;
  try{
    let url = '', headers = {'Content-Type':'application/json'}, body = {};
    if(cfg.provider === 'openai'){
      url = 'https://api.openai.com/v1/chat/completions';
      headers['Authorization'] = `Bearer ${chaveLimpa}`;
      body = {model: cfg.model || 'gpt-4o-mini', messages: [{role:'system', content: sysPrompt},{role:'user', content: pergunta}], max_tokens: 2500, temperature: 0.9};
    } else if(cfg.provider === 'anthropic'){
      url = 'https://api.anthropic.com/v1/messages';
      headers['x-api-key'] = chaveLimpa;
      headers['anthropic-version'] = '2023-06-01';
      headers['anthropic-dangerous-direct-browser-access'] = 'true';
      body = {model: cfg.model || 'claude-3-5-sonnet-20241022', max_tokens: 2500, system: sysPrompt, messages: [{role:'user', content: pergunta}]};
    }
    const res = await fetch(url, {method:'POST', headers, body: JSON.stringify(body)});
    if(!res.ok){
      let motivo = res.status === 401 || res.status === 403 ? 'Chave inválida' : res.status === 429 ? 'Cota excedida' : 'Erro ' + res.status;
      return {erro:true, motivo, statusCode:res.status};
    }
    const data = await res.json();
    let texto = cfg.provider === 'openai' ? (data.choices?.[0]?.message?.content || '') : (data.content?.[0]?.text || '');
    if(!texto) return {erro:true, motivo:'Vazio', statusCode:200};
    const emg = temEmergencia(pergunta);
    return {texto: texto.trim(), tipo: emg ? 'emergencia' : 'ia-real', real: true, fonte:'ia-real'};
  }catch(e){ return {erro:true, motivo:'Rede: '+e.message, statusCode:0}; }
}
function temEmergencia(texto){
  const pal = ['emergência','emergencia','socorro','urgente','morrendo','atropelado','convulsionando','intoxicado','envenenado','sangrando muito','não respira','engasgado','sufocando'];
  const t = texto.toLowerCase();
  return pal.some(p => t.includes(p));
}

function rotuloTipo(t, fonte, comWeb){

function formatarMensagem(texto){
  let t = esc(texto);
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/_([^_]+)_/g, '<em style="opacity:.75">$1</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:#9B5DE5;text-decoration:underline;font-weight:600">$1</a>');
  t = t.replace(/`([^`]+)`/g, '<code style="background:#F1F4F9;padding:1px 5px;border-radius:4px;font-size:12px">$1</code>');
  t = t.replace(/\n/g, '<br>');
  t = t.replace(/^(<br>)+/, '');
  return t;
}

(function swipeInit(){
  const sw = $('#swiper');
  if(!sw) return;
  let x0=0, y0=0, ativo=false, cancelado=false;
  const AREAS_PROTEGIDAS = [
    '.chat-body', '.chat-suggestions', '.chat-input',
    '.subnav', '.subnav-btn',
    '.chips', '.chip',
    '.search-wrap', '.search-input',
    '.marca-list', '.marca-chip',
    '.album-timeline', '.album-tl-grid',
    '.bar-chart',
    '.growth-chart',
    'input', 'textarea', 'select', 'label',
    '.ps-body', '.ps-item',
    '.racao-card', '.racao-foto'
  ];
  function estaProtegido(el){
    if(!el || !el.closest) return false;
    for(let i=0; i<AREAS_PROTEGIDAS.length; i++){
      if(el.closest(AREAS_PROTEGIDAS[i])) return true;
    }
    return false;
  }
  sw.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1){ ativo = false; return; }
    if(estaProtegido(e.target)){ ativo = false; return; }
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    ativo = true;
    cancelado = false;
  }, {passive:true});
  sw.addEventListener('touchmove', function(e){
    if(!ativo || cancelado) return;
    if(e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = Math.abs(t.clientX - x0);
    const dy = Math.abs(t.clientY - y0);
    if(dy > dx * 1.2 && dy > 12){
      cancelado = true;
      ativo = false;
    }
  }, {passive:true});
  sw.addEventListener('touchend', function(e){
    if(!ativo || cancelado){ ativo = false; return; }
    ativo = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0;
    const dy = t.clientY - y0;
    if(Math.abs(dx) > 75 && Math.abs(dx) > Math.abs(dy) * 2.2){
      if(dx < 0) goTo(Math.min(7, state.currentPage + 1));
      else goTo(Math.max(0, state.currentPage - 1));
    }
  }, {passive:true});
  sw.addEventListener('touchcancel', function(){ ativo = false; cancelado = false; }, {passive:true});
})();

function normalizarVacina(v){
  if(!v) return null;
  if(typeof v === 'string') return {data: v, marca:'', lote:'', vet:'', clinica:'', obs:''};
  return v;
}
/* ✅ v10.3 — Cálculo com dias para vermífugo */
function calcularDueVacina(pet, v){
  const lista = PROTOCOLO[pet.especie] || [];
  const isVerm = v.tipo === 'vermifugo';
  const vDias = getIntervaloDiasItem(v);
  
  // 1. Procura anterior da mesma série (mesmo tipo, menor "sem")
  const mesmaSerie = lista.filter(x => x.tipo === v.tipo && (x.sem || 0) < (v.sem || 0));
  for(let i = mesmaSerie.length - 1; i >= 0; i--){
    const ant = mesmaSerie[i];
    const rawAnt = pet.vacinas && pet.vacinas[ant.id];
    const antAplicada = normalizarVacina(rawAnt);
    if(antAplicada && antAplicada.data){
      const baseDate = new Date(antAplicada.data + 'T12:00:00');
      if(isVerm){
        // Para vermífugo, diferença em dias
        const dias = Math.max(1, vDias - getIntervaloDiasItem(ant));
        return addDays(baseDate, dias);
      }
      const semanas = getIntervaloEntre(pet, ant, v, antAplicada.marca);
      return addWeeks(baseDate, semanas);
    }
  }
  
  // 2. Procura qualquer anterior (por índice)
  const idx = lista.findIndex(x => x.id === v.id);
  for(let i = idx - 1; i >= 0; i--){
    const ant = lista[i];
    const rawAnt = pet.vacinas && pet.vacinas[ant.id];
    const antAplicada = normalizarVacina(rawAnt);
    if(antAplicada && antAplicada.data){
      const baseDate = new Date(antAplicada.data + 'T12:00:00');
      if(isVerm){
        // Padrão 15 dias se for vermífugo
        return addDays(baseDate, 15);
      }
      const semanas = getIntervaloEntre(pet, ant, v, antAplicada.marca);
      return addWeeks(baseDate, semanas);
    }
  }
  
  // 3. Fallback: nascimento + intervalo
  const baseDate = new Date(pet.nascimento + 'T12:00:00');
  if(isVerm){
    return addDays(baseDate, vDias);
  }
  return addWeeks(baseDate, v.sem);
}
function statusVacina(pet, v){
  const raw = pet.vacinas && pet.vacinas[v.id];
  const aplicada = normalizarVacina(raw);
  const hoje = new Date(); hoje.setHours(12,0,0,0);
  if(aplicada && aplicada.data){ return {status:'ok', aplicada, due: new Date(aplicada.data + 'T12:00:00')}; }
  const due = calcularDueVacina(pet, v);
  const d = diffDias(due, hoje);
  if(d < 0) return {status:'atrasada', due, dias: Math.abs(d)};
  if(d <= 30) return {status:'proxima', due, dias: d};
  return {status:'futura', due, dias: d};
}
function dueVeioDeCascata(pet, v){
  const lista = PROTOCOLO[pet.especie] || [];
  const mesmaSerie = lista.filter(x => x.tipo === v.tipo && (x.sem || 0) < (v.sem || 0));
  for(let i = mesmaSerie.length - 1; i >= 0; i--){
    const rawAnt = pet.vacinas && pet.vacinas[mesmaSerie[i].id];
    if(normalizarVacina(rawAnt)) return true;
  }
  const idx = lista.findIndex(x => x.id === v.id);
  for(let i = idx - 1; i >= 0; i--){
    const rawAnt = pet.vacinas && pet.vacinas[lista[i].id];
    if(normalizarVacina(rawAnt)) return true;
  }
  return false;
}
function resumoVacinas(pet){
  const lista = PROTOCOLO[pet.especie] || [];
  let ok=0, atrasada=0, proxima=0, futura=0;
  lista.forEach(v=>{
    const s = statusVacina(pet, v).status;
    if(s==='ok') ok++; else if(s==='atrasada') atrasada++;
    else if(s==='proxima') proxima++; else futura++;
  });
  return {total:lista.length, ok, atrasada, proxima, futura};
}

function calcularProximoEvento(){
  let melhor = null;
  state.pets.forEach(p=>{
    (PROTOCOLO[p.especie]||[]).forEach(v=>{
      const st = statusVacina(p, v);
      if(st.status === 'ok') return;
      const peso = st.status === 'atrasada' ? -10000 + (st.dias||0) : (st.dias||9999);
      if(!melhor || peso < melhor.peso){
        let dataTxt;
        if(st.status === 'atrasada') dataTxt = 'Atrasada há ' + st.dias + ' dias';
        else dataTxt = 'Prevista: ' + fmtData(st.due.toISOString().slice(0,10));
        melhor = {peso, petId:p.id, petNome:p.nome, titulo:v.nome, obs:v.obs, status:st.status, dataTxt};
      }
    });
  });
  return melhor;
}

      <div class="marca-list" id="marcaList">

      </div>
      <input class="input" id="vMarcaOutro" placeholder="Outra..." style="margin-top:10px" oninput="state.marcaVacinaSel=this.value;atualizarChips();atualizarInfoIntervalo()">
      <div id="marcaIntervaloInfo"></div>
    </div>
    <div class="row-2">
      <div class="field"><label>LOTE</label><input class="input" id="vLote"></div>
      <div class="field"><label>VET</label><input class="input" id="vVet"></div>
    </div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="salvarAplicacaoVacina('${petId}','${vacId}')">Salvar</button>`);
  setTimeout(()=> atualizarInfoIntervalo(), 100);

/* ✅ v10.3 — Mostra dias para vermífugo */
function atualizarInfoIntervalo(){
  const el = $('#marcaIntervaloInfo');
  if(!el) return;
  const pet = state.pets.find(p => p.id === state.__vacPetId);
  if(!pet){ el.innerHTML = ''; return; }
  const vac = PROTOCOLO[pet.especie].find(v => v.id === state.__vacAplicandoId);
  if(!vac){ el.innerHTML = ''; return; }
  const marca = state.marcaVacinaSel || ($('#vMarcaOutro') ? $('#vMarcaOutro').value.trim() : '');
  if(!marca){ el.innerHTML = ''; return; }
  
  const data = ($('#vData') ? $('#vData').value : hojeISO()) || hojeISO();
  const isVerm = vac.tipo === 'vermifugo';
  
  if(isVerm){
    // v10.3: Para vermífugo, sempre trabalhar com dias
    let ivDias = vac.dias || 15;
    // Se a marca tem intervalo específico, verificar se é filhote/adulto
    const info = PRODUTOS_VERMIFUGO[marca];
    if(info){
      const meses = idadeDetalhada(pet) ? idadeDetalhada(pet).meses : 99;
      if(meses < 6 && info.intervaloFilhote) ivDias = info.intervaloFilhote;
      // Mas para verm1, manter 15 dias como padrão
      if(vac.id === 'verm1') ivDias = 15;
    }
    const proxData = addDays(new Date(data + 'T12:00:00'), ivDias);
    el.innerHTML = `<div class="marca-info"><span class="mi-ic">📅</span><div>Com <strong>${esc(marca)}</strong>, a próxima dose desta série será em <strong>${ivDias} dias</strong> → <strong>${fmtData(proxData.toISOString().slice(0,10))}</strong></div></div>`;
  } else {
    const iv = getIntervaloSemanasMarca(pet.especie, vac.tipo, marca);
    if(!iv){ el.innerHTML = ''; return; }
    const proxData = addWeeks(new Date(data + 'T12:00:00'), iv);
    el.innerHTML = `<div class="marca-info"><span class="mi-ic">📅</span><div>Com <strong>${esc(marca)}</strong>, a próxima dose desta série será em <strong>${iv} semanas</strong> → <strong>${fmtData(proxData.toISOString().slice(0,10))}</strong></div></div>`;
  }
}

/* ✅ v10.3 — Mensagem de sucesso em dias para vermífugo */
function salvarAplicacaoVacina(petId, vacId){
  const pet = state.pets.find(p=>p.id === petId);
  if(!pet) return;
  const data = $('#vData').value || hojeISO();
  const marcaInput = ($('#vMarcaOutro').value || '').trim();
  const marca = marcaInput || state.marcaVacinaSel || '';
  if(!pet.vacinas) pet.vacinas = {};
  pet.vacinas[vacId] = {data, marca, lote: $('#vLote').value.trim(), vet: $('#vVet').value.trim()};
  const lista = PROTOCOLO[pet.especie] || [];
  const atual = lista.find(x => x.id === vacId);
  let msgProx = '';
  if(atual){
    const mesmaSerie = lista.filter(x => x.tipo === atual.tipo && (x.sem || 0) > (atual.sem || 0));
    if(mesmaSerie.length > 0){
      const prox = mesmaSerie[0];
      const rawProx = pet.vacinas && pet.vacinas[prox.id];
      if(!rawProx){
        const isVerm = atual.tipo === 'vermifugo';
        if(isVerm){
          const proxData = addDays(new Date(data + 'T12:00:00'), 15);
          msgProx = ` Próxima (${prox.nome}): ${fmtData(proxData.toISOString().slice(0,10))} (15 dias)`;
        } else {
          const iv = getIntervaloSemanasMarca(pet.especie, atual.tipo, marca) || Math.max(1, prox.sem - atual.sem);
          const proxData = addWeeks(new Date(data + 'T12:00:00'), iv);
          msgProx = ` Próxima (${prox.nome}): ${fmtData(proxData.toISOString().slice(0,10))} (${iv} sem)`;
        }
      }
    }
  }
  saveDB();
  closeModal();
  toast('Vacina registrada! 🎉' + msgProx);
  renderVacinas();
}

function abrirCarteiraVacina(petId){
  const pet = state.pets.find(x=>x.id === petId);
  if(!pet) return;
  state.petSelecionado = petId;
  const lista = PROTOCOLO[pet.especie] || [];
  const aplicadas = [], pendentes = [], atrasadas = [];
  lista.forEach(v=>{
    const st = statusVacina(pet, v);
    if(st.status === 'ok') aplicadas.push({v, st});
    else if(st.status === 'atrasada') atrasadas.push({v, st});
    else pendentes.push({v, st});
  });
  const total = lista.length, totalOk = aplicadas.length;
  const progresso = Math.round((totalOk/total)*100);
  let numSeq = 0;
  const renderVacItem = (item, tipo) => {
    numSeq++;
    const {v, st} = item;
    let statusTxt = '', dataTxt = '', marcaHtml = '';
    if(tipo === 'aplicada'){
      statusTxt = 'Aplicada'; dataTxt = '📅 ' + fmtData(st.aplicada.data);
      if(st.aplicada.marca){
        const isVerm = v.tipo === 'vermifugo';
        const iv = isVerm ? 15 : getIntervaloSemanasMarca(pet.especie, v.tipo, st.aplicada.marca);
        marcaHtml = `<div class="cv-marca">💉 ${esc(st.aplicada.marca)}${iv ? ' · ' + iv + (isVerm?'d':'sem') : ''}</div>`;
      }
    } else if(tipo === 'atrasada'){ statusTxt = 'Atrasada'; dataTxt = '⏰ ' + fmtData(st.due.toISOString().slice(0,10)); }
    else { statusTxt = 'Pendente'; dataTxt = '📅 ' + fmtData(st.due.toISOString().slice(0,10)); }
    return `<div class="carteira-vac ${tipo}"><div class="cv-num">${String(numSeq).padStart(2,'0')}</div><div class="cv-body"><div class="cv-nome">${esc(v.nome)}</div><div class="cv-data">${dataTxt}</div>${marcaHtml}</div><div class="cv-status">${statusTxt}</div></div>`;
  };
  const avatar = pet.foto ? `<img src="${pet.foto}" style="width:100%;height:100%;object-fit:cover">` : (pet.emoji||'🐾');
  let html = `
    <div class="carteira">
      <div class="carteira-header"><div class="ch-titulo">Carteira de Vacinação</div><h3>${esc(pet.nome)}</h3><div class="ch-brasil">🇧🇷</div></div>
      <div class="carteira-pet">
        <div class="cp-avatar ${pet.especie==='gato'?'cat':''}">${avatar}</div>
        <div class="cp-info"><div class="cp-nome">${esc(pet.nome)}</div><div class="cp-sub">${pet.especie==='gato'?'Felino':'Canino'} · ${esc(pet.raca||'SRD')}</div>
        <div class="cp-linha"><span class="cp-chip">${calcIdade(pet.nascimento)}</span><span class="cp-chip">${pet.sexo==='femea'?'Fêmea':'Macho'}</span>${pet.peso?`<span class="cp-chip">${esc(pet.peso)} kg</span>`:''}</div></div>
      </div>
      <div class="carteira-info">
        <div class="ci-item"><div class="ci-label">Nascimento</div><div class="ci-valor">${fmtData(pet.nascimento)}</div></div>
        <div class="ci-item"><div class="ci-label">Espécie</div><div class="ci-valor">${pet.especie==='gato'?'Gato':'Cão'}</div></div>
        <div class="ci-item"><div class="ci-label">Raça</div><div class="ci-valor">${esc(pet.raca||'SRD')}</div></div>
        <div class="ci-item"><div class="ci-label">Emitida em</div><div class="ci-valor">${fmtData(hojeISO())}</div></div>
      </div>
      <div class="carteira-secao"><div class="cs-titulo">📊 Resumo <span class="cs-count">${totalOk}/${total}</span></div>
        <div style="height:8px;background:#F1F4F9;border-radius:6px;overflow:hidden;margin-bottom:8px"><div style="height:100%;width:${progresso}%;background:linear-gradient(90deg,#25C2B0,#4AD4C3);border-radius:6px"></div></div>
        <div style="font-size:11px;color:var(--muted);font-weight:600;text-align:center">${progresso}% completo</div></div>`;
  if(aplicadas.length > 0) html += `<div class="carteira-secao"><div class="cs-titulo">✅ Aplicadas</div>${aplicadas.map(a => renderVacItem(a, 'aplicada')).join('')}</div>`;
  if(atrasadas.length > 0) html += `<div class="carteira-secao"><div class="cs-titulo" style="color:var(--danger)">⚠️ Atrasadas</div>${atrasadas.map(a => renderVacItem(a, 'atrasada')).join('')}</div>`;
  if(pendentes.length > 0) html += `<div class="carteira-secao"><div class="cs-titulo" style="color:#B47800">⏳ Pendentes</div>${pendentes.map(p => renderVacItem(p, 'pendente')).join('')}</div>`;
  html += `<div class="carteira-assinatura"><div class="ca-campo"><div class="ca-txt">Veterinário</div><div class="ca-trace">CRMV</div></div><div class="ca-campo"><div class="ca-txt">Tutor</div><div class="ca-trace">Nome</div></div></div>
      <div class="carteira-rodape"><div class="cr-app"><div class="cr-logo">🐾</div><span>PetVida ${APP_VERSION}</span></div><div>${fmtData(hojeISO())}</div></div>
    </div>
    <div class="carteira-alerta"><div class="ca-emoji">ℹ️</div><div>Não substitui a carteira oficial do veterinário.</div></div>`;
  openModal(headPadrao('Carteira', 'Registro de ' + pet.nome), html,

}
