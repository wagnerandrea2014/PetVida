/* PDF */
function gerarPDFCarteira(petId){
  const pet = state.pets.find(x=>x.id === petId);
  if(!pet){ toast('Pet não encontrado'); return; }
  const lista = PROTOCOLO[pet.especie] || [];
  const rows = lista.map(v=>{
    const st = statusVacina(pet, v);
    let status = '', dataTxt = '', marcaTxt = '';
    if(st.status === 'ok'){ status = 'Aplicada'; dataTxt = fmtData(st.aplicada.data); marcaTxt = st.aplicada.marca || '—'; }
    else if(st.status === 'atrasada'){ status = 'Atrasada'; dataTxt = 'Prev: ' + fmtData(st.due.toISOString().slice(0,10)); }
    else { status = 'Pendente'; dataTxt = 'Prev: ' + fmtData(st.due.toISOString().slice(0,10)); }
    return `<tr><td>${esc(v.nome)}</td><td>${dataTxt}</td><td>${marcaTxt || '—'}</td><td>${status}</td></tr>`;
  }).join('');
  const res = resumoVacinas(pet);
  const html = gerarHTMLImpressao(`Carteira de Vacinação — ${esc(pet.nome)}`, `
    <div class="pdf-hero">
      <h1>🐾 Carteira de Vacinação</h1>
      <div class="pdf-sub">PetVida ${APP_VERSION} · Emitido em ${fmtData(hojeISO())}</div>
    </div>
    <table class="pdf-info"><tr><td><b>Nome:</b> ${esc(pet.nome)}</td><td><b>Espécie:</b> ${pet.especie==='gato'?'Felino':'Canino'}</td></tr><tr><td><b>Raça:</b> ${esc(pet.raca||'SRD')}</td><td><b>Sexo:</b> ${pet.sexo==='femea'?'Fêmea':'Macho'}</td></tr><tr><td><b>Nascimento:</b> ${fmtData(pet.nascimento)}</td><td><b>Idade:</b> ${calcIdade(pet.nascimento)}</td></tr><tr><td><b>Peso:</b> ${pet.peso?esc(pet.peso)+' kg':'—'}</td><td><b>Progresso:</b> ${res.ok}/${res.total} vacinas</td></tr></table>
    <h2>Protocolo Vacinal</h2>
    <table class="pdf-tbl"><thead><tr><th>Vacina</th><th>Data</th><th>Marca</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="pdf-assinatura">
      <div class="pdf-ass"><div class="pdf-line"></div><div>Assinatura do Veterinário · CRMV</div></div>
      <div class="pdf-ass"><div class="pdf-line"></div><div>Assinatura do Tutor</div></div>
    </div>`);
  abrirJanelaImpressao(html);
}
function gerarPDFFicha(petId){
  const pet = state.pets.find(x=>x.id === petId);
  if(!pet){ toast('Pet não encontrado'); return; }
  const h = pet.historico || {};
  const listaHist = (titulo, arr, mapper) => {
    if(!arr || arr.length === 0) return '';
    return `<h2>${titulo}</h2><table class="pdf-tbl"><tbody>${arr.map(x=>`<tr><td>${mapper(x)}</td></tr>`).join('')}</tbody></table>`;
  };
  const vac = PROTOCOLO[pet.especie] || [];
  const vacAplic = vac.filter(v => statusVacina(pet, v).status === 'ok').map(v => {
    const st = statusVacina(pet, v);
    return `<tr><td>${esc(v.nome)}</td><td>${fmtData(st.aplicada.data)}</td><td>${esc(st.aplicada.marca||'—')}</td></tr>`;
  }).join('');
  const pesos = (pet.pesos || []).slice().sort((a,b)=> new Date(a.data) - new Date(b.data));
  const pesoRows = pesos.map(p => `<tr><td>${fmtData(p.data)}</td><td>${esc(p.valor)} kg</td></tr>`).join('');

    ${vacAplic ? `<h2>Vacinas Aplicadas</h2><table class="pdf-tbl"><thead><tr><th>Vacina</th><th>Data</th><th>Marca</th></tr></thead><tbody>${vacAplic}</tbody></table>` : ''}
    ${pesoRows ? `<h2>Histórico de Peso</h2><table class="pdf-tbl"><thead><tr><th>Data</th><th>Peso</th></tr></thead><tbody>${pesoRows}</tbody></table>` : ''}
    ${listaHist('Consultas', h.consultas, c => `<b>${esc(c.motivo)}</b> — ${fmtData(c.data)} ${c.veterinario?'· '+esc(c.veterinario):''} ${c.diagnostico?'<br><i>'+esc(c.diagnostico)+'</i>':''}`)}
    ${listaHist('Exames', h.exames, e => `<b>${esc(e.nome)}</b> — ${fmtData(e.data)} ${e.laboratorio?'· '+esc(e.laboratorio):''}`)}
    ${listaHist('Medicamentos', h.medicamentos, m => `<b>${esc(m.nome)}</b> ${m.dose?'· '+esc(m.dose):''} ${m.frequencia?'· '+esc(m.frequencia):''} ${m.inicio?fmtData(m.inicio):''}`)}
    ${listaHist('Cirurgias', h.cirurgias, c => `<b>${esc(c.nome)}</b> — ${fmtData(c.data)} ${c.veterinario?'· '+esc(c.veterinario):''}`)}
    ${listaHist('Alergias', h.alergias, a => `<b>${esc(a.tipo)}</b> ${a.descricao?'— '+esc(a.descricao):''}`)}
    <div class="pdf-assinatura">
      <div class="pdf-ass"><div class="pdf-line"></div><div>Assinatura do Veterinário · CRMV</div></div>
    </div>`);
  abrirJanelaImpressao(html);
}

function abrirJanelaImpressao(html){

const SAUDE_SUBS = [

  {id:'tutores', label:'👥 Tutores'},

  {id:'guias', label:'📚 Guias'}
];
function setSaudeSub(sub){ state.saudeSub = sub; renderSaude(); }
function renderSaude(){
  const subnav = $('#saudeSubnav');
  const el = $('#saudeContent');

    subnav.innerHTML = '';
    el.innerHTML = `<div class="empty"><span class="e-ic">❤️</span><h4>Nenhum pet</h4></div><button class="btn btn-primary" style="margin-top:14px" onclick="abrirModalPet()">Cadastrar</button>`;

  }
  if(!state.petSelecionado || !state.pets.find(p=>p.id===state.petSelecionado)) state.petSelecionado = state.pets[0].id;
  subnav.innerHTML = `<div class="subnav">${SAUDE_SUBS.map(s=>`<button class="subnav-btn ${state.saudeSub===s.id?'active':''}" onclick="setSaudeSub('${s.id}')" type="button">${s.label}</button>`).join('')}</div>`;

    petPicker = `<div class="chips" style="margin-bottom:14px">${state.pets.map(p=>`<button class="chip ${p.id===state.petSelecionado?'active':''}" onclick="selecionarPetSaude('${p.id}')" type="button">${p.emoji||'🐾'} ${esc(p.nome)}</button>`).join('')}</div>`;
  }
  let body = petPicker;
  switch(state.saudeSub){
    case 'album': body += renderSaudeAlbum(pet); break;
    case 'alimentacao': body += renderSaudeAlimentacao(pet); break;
    case 'banho': body += renderSaudeBanho(pet); break;
    case 'historico': body += renderSaudeHistorico(pet); break;
    case 'prevencao': body += renderSaudePrevencao(pet); break;
    case 'diario': body += renderSaudeDiario(pet); break;
    case 'tutores': body += renderSaudeTutores(pet); break;
    case 'compras': body += renderSaudeCompras(pet); break;

  html += renderCurvaCrescimento(pet);

function renderSaudeAlbum(pet){
  const album = (pet.album || []).slice().sort((a,b) => new Date(b.data) - new Date(a.data));
  let html = '';
  if(album.length > 0){
    const primeira = album[album.length - 1]; const ultima = album[0];
    const primeiroAno = primeira.data ? new Date(primeira.data + 'T12:00:00').getFullYear() : '—';
    const ultimoAno = ultima.data ? new Date(ultima.data + 'T12:00:00').getFullYear() : '—';
    html += `<div class="album-stats"><div class="album-stat"><div class="album-stat-n">${album.length}</div><div class="album-stat-l">Fotos</div></div><div class="album-stat"><div class="album-stat-n">${primeiroAno === ultimoAno ? primeiroAno : primeiroAno + '–' + ultimoAno}</div><div class="album-stat-l">Período</div></div></div>`;
  }
  html += `<button class="btn btn-primary" style="margin-bottom:14px" onclick="abrirModalAddFotoAlbum('${pet.id}')" type="button"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Adicionar foto</button>`;
  if(album.length === 0){
    html += `<div class="empty"><span class="e-ic">📸</span><h4>Álbum vazio</h4><p>Registre a evolução!</p></div>`;
    return html;
  }
  const grupos = {};
  album.forEach(f => {
    const d = f.data ? new Date(f.data + 'T12:00:00') : new Date();
    const chave = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    if(!grupos[chave]) grupos[chave] = [];
    grupos[chave].push(f);
  });
  const mesesNomes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const chavesOrd = Object.keys(grupos).sort().reverse();
  html += `<div class="album-timeline">`;
  chavesOrd.forEach(chave => {
    const [ano, mes] = chave.split('-');
    const label = mesesNomes[parseInt(mes)-1] + ' ' + ano;
    html += `<div class="album-tl-group"><div class="album-tl-dot"></div><div class="album-tl-label">${label}</div><div class="album-tl-grid">${grupos[chave].map(f => `<div class="album-item" onclick="abrirFotoAlbum('${pet.id}','${f.id}')"><img src="${f.foto}" alt="" loading="lazy">${f.titulo ? `<div class="album-info"><div class="album-titulo">${esc(f.titulo)}</div></div>` : ''}</div>`).join('')}</div></div>`;
  });
  html += `</div>`;
  return html;
}

function processarFotoAlbum(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 15 * 1024 * 1024){ toast('Foto muito grande'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    redimensionarImagem(e.target.result, 800, 0.78, (dataUrl) => {
      formAlbum.foto = dataUrl;
      const body = $('#modalBody'); if(body) body.innerHTML = formAlbumHTML();
    });
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function processarFoto(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 10 * 1024 * 1024){ toast('Foto muito grande'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    redimensionarImagem(e.target.result, 500, 0.82, (dataUrl) => {
      formPet.foto = dataUrl;
      const body = $('#modalBody'); if(body) body.innerHTML = formPetHTML();
      toast('Foto adicionada! 📷');
    });
  };
  reader.readAsDataURL(file);
  input.value = '';
}

    <div id="vermifugoInfo"></div>
    <div class="field"><label>MODO DE TRATAMENTO</label>
      <div class="tipo-tratamento" id="tipoTratamento">
        <div class="tt-btn ${tipoInicial==='filhote'?'active':''}" data-tipo="filhote" onclick="setVermifugoTipo('filhote')">
          <span class="tt-em">🐶</span>
          <span class="tt-lb">Filhote</span>
          <span class="tt-sub">15 dias</span>
        </div>
        <div class="tt-btn ${tipoInicial==='adulto'?'active':''}" data-tipo="adulto" onclick="setVermifugoTipo('adulto')">
          <span class="tt-em">🐕</span>
          <span class="tt-lb">Adulto</span>
          <span class="tt-sub">90 dias</span>
        </div>
        <div class="tt-btn ${tipoInicial==='custom'?'active':''}" data-tipo="custom" onclick="setVermifugoTipo('custom')">
          <span class="tt-em">⚙️</span>
          <span class="tt-lb">Custom</span>
          <span class="tt-sub">Definir</span>
        </div>
      </div>
    </div>
    <div class="field" id="customIntervaloField" style="display:none"><label>INTERVALO (dias)</label><input class="input" type="number" id="hvfCustomIntervalo" min="1" max="365" value="90"></div>
    <div class="field"><label>DATA</label><input class="input" type="date" id="hvfData" value="${hojeISO()}"></div>
    <div class="idade-info-card" id="vermifugoIdadeInfo"><span class="iic-ic">💡</span><div>Filhotes (até 6 meses) geralmente vermifugam a cada 15 dias. Adultos a cada 3 meses.</div></div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarVermifugo()">Salvar</button>`);
}
function setVermifugoTipo(tipo){
  state.__vermifugoTipo = tipo;
  $$('#tipoTratamento .tt-btn').forEach(b => b.classList.toggle('active', b.dataset.tipo === tipo));
  const cf = $('#customIntervaloField');
  if(cf) cf.style.display = tipo === 'custom' ? 'block' : 'none';
}
function atualizarInfoVermifugo(){
  const el = $('#vermifugoInfo');
  if(!el) return;
  const nome = $('#hvfProduto').value;
  if(!nome){ el.innerHTML = ''; return; }
  const info = PRODUTOS_VERMIFUGO[nome];
  if(!info){ el.innerHTML = ''; return; }
  const ivF = info.intervaloFilhote || 15;
  const ivA = info.intervalo || 90;
  el.innerHTML = `<div class="calc-note" style="background:linear-gradient(140deg,#F3EAFE,#E9DDFB);border-color:#D9C4F5;color:#6B31B8"><span class="cn-ic">💊</span><div><b>Princípio ativo:</b> ${esc(info.principio)}<br><b>Apresentação:</b> ${esc(info.apresentacao)}<br><b>Intervalo filhote:</b> ${ivF} dias · <b>Adulto:</b> ${ivA} dias</div></div>`;
}
function salvarVermifugo(){
  const pet = state.pets.find(p=>p.id === state.petSelecionado);
  if(!pet) return;
  const produto = $('#hvfProduto').value;
  if(!produto){ toast('Selecione o produto'); return; }
  const tipo = state.__vermifugoTipo || 'adulto';
  let iv;
  if(tipo === 'custom'){
    iv = parseInt($('#hvfCustomIntervalo').value) || 90;
  } else if(tipo === 'filhote'){
    iv = PRODUTOS_VERMIFUGO[produto]?.intervaloFilhote || 15;
  } else {
    iv = PRODUTOS_VERMIFUGO[produto]?.intervalo || 90;
  }
  if(!pet.vermifugos) pet.vermifugos = [];
  pet.vermifugos.push({id:uid(), produto, data:$('#hvfData').value||hojeISO(), tipo, intervalo: iv});
  const prox = addDays(new Date(($('#hvfData').value||hojeISO()) + 'T12:00:00'), iv);
  saveDB(); closeModal(); toast('Registrado! 🪱 Próximo: ' + fmtData(prox.toISOString().slice(0,10)) + ' (' + iv + 'd)'); renderSaude();
}

    <div class="field"><label>PROFISSIONAL / LOCAL</label><input class="input" id="hbProf" placeholder="Ex: Pet shop X"></div>

function salvarBanho(){
  const pet = state.pets.find(p=>p.id === state.petSelecionado);
  if(!pet) return;
  if(!pet.banhos) pet.banhos = [];
  pet.banhos.push({id:uid(), tipo:$('#hbTipo').value, data:$('#hbData').value||hojeISO(), shampoo:$('#hbShampoo').value.trim(), profissional:$('#hbProf').value.trim(), nota:$('#hbNota').value.trim()});

}
function abrirModalGasto(){
  if(!state.petSelecionado){ toast('Selecione um pet'); return; }

      <div class="field"><label>VALOR (R$) *</label><input class="input" type="number" step="0.01" min="0" inputmode="decimal" id="hgValor"></div>

}
function salvarGasto(){
  const pet = state.pets.find(p=>p.id === state.petSelecionado);
  if(!pet) return;
  const val = parseFloat($('#hgValor').value);
  if(!val || val <= 0){ toast('Informe o valor'); return; }
  if(!pet.gastos) pet.gastos = [];
  pet.gastos.push({id:uid(), categoria:$('#hgCat').value, descricao:$('#hgDesc').value.trim(), valor:String(val), data:$('#hgData').value||hojeISO()});
  saveDB(); closeModal(); toast('Gasto registrado! 💰'); renderSaude();
}
function abrirModalItemCompra(){

function abrirModalDiario(){
  if(!state.petSelecionado){ toast('Selecione um pet'); return; }
  const humores = [{id:'feliz',emoji:'😊',label:'Feliz'},{id:'calmo',emoji:'😌',label:'Calmo'},{id:'agitado',emoji:'😰',label:'Agitado'},{id:'triste',emoji:'😢',label:'Triste'},{id:'doente',emoji:'🤒',label:'Doente'}];

let humorSelecionado = 'feliz';

function abrirModalIDDigital(petId){
  const id = petId || state.petSelecionado;
  const pet = state.pets.find(p=>p.id === id);
  if(!pet){ toast('Pet não encontrado'); return; }
  state.petSelecionado = id;
  const codigo = gerarIdPet(pet);
  const tutor = (pet.tutores||[])[0];
  const contato = tutor ? (tutor.telefone || '—') : '—';
  const alergias = (pet.historico && pet.historico.alergias || []).map(a=>a.tipo).join(', ') || 'Nenhuma';
  openModal(headPadrao('ID Digital', 'Identificação de ' + pet.nome),
    `<div class="id-digital">
      <div class="idd-top"><div><div class="idd-titulo">ID Digital PetVida</div><div class="idd-nome" style="margin-top:6px">${esc(pet.nome)}</div><div class="idd-sub">${pet.especie==='gato'?'Felino':'Canino'} · ${esc(pet.raca||'SRD')} · ${calcIdade(pet.nascimento)}</div></div><div class="idd-logo">🐾</div></div>
      <div class="idd-grid">
        <div class="idd-item"><div class="idd-item-l">Código</div><div class="idd-item-v" style="font-family:'Courier New',monospace">${codigo}</div></div>
        <div class="idd-item"><div class="idd-item-l">Idade humana</div><div class="idd-item-v">${idadeHumana(pet)}</div></div>
        <div class="idd-item"><div class="idd-item-l">Sexo</div><div class="idd-item-v">${pet.sexo==='femea'?'Fêmea':'Macho'}</div></div>
        <div class="idd-item"><div class="idd-item-l">Peso</div><div class="idd-item-v">${pet.peso?esc(pet.peso)+' kg':'—'}</div></div>
      </div>
      <div class="idd-qr"><div class="idd-qr-pattern">${padraoQr(pet, 74)}</div><div class="idd-qr-info"><div class="idd-qr-code">${codigo}</div><div class="idd-qr-txt">Apresente em caso de perda.</div></div></div>
      <div class="idd-footer"><span>📞 ${esc(contato)}</span><span>${fmtData(hojeISO())}</span></div>
    </div>
    <div class="blk warn"><h4><span class="b-ic">⚠️</span>Alergias</h4><p>${esc(alergias)}</p></div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Fechar</button><button class="btn btn-primary" onclick="compartilharID('${pet.id}')">Compartilhar</button>`);
}
function compartilharID(petId){
  const pet = state.pets.find(p=>p.id === petId);
  if(!pet) return;
  const codigo = gerarIdPet(pet);
  const texto = `🐾 ID DIGITAL - ${pet.nome}\n\nCódigo: ${codigo}\nIdade: ${calcIdade(pet.nascimento)}\nPeso: ${pet.peso?pet.peso+' kg':'—'}`;
  if(navigator.share) navigator.share({title:'ID - ' + pet.nome, text: texto}).catch(()=>{});
  else if(navigator.clipboard) navigator.clipboard.writeText(texto).then(()=> toast('Copiado! 📋')).catch(()=>{});
  else toast('Indisponível');
}
function abrirModalEscore(petId){
  const id = petId || state.petSelecionado;
  const pet = state.pets.find(p=>p.id === id);
  if(!pet){ toast('Pet não encontrado'); return; }
  state.petSelecionado = id;
  const atual = pet.escore || 3;
  escoreSelecionado = atual;
  openModal(headPadrao('Escore corporal', 'Avalie a condição de ' + pet.nome),
    `<div class="escore-scale">
      ${ESCORES.map(e=>`<div class="escore-opt ${e.n===atual?'active':''}" data-n="${e.n}" onclick="selEscore(${e.n})"><span class="eo-emoji">${e.emoji}</span><span class="eo-num">${e.n}</span></div>`).join('')}
    </div>
    <div id="escoreInfo"></div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Fechar</button>
     <button class="btn btn-primary" onclick="salvarEscore()">Salvar</button>`);
  setTimeout(()=> atualizarEscoreInfo(atual), 50);
}
function selEscore(n){
  escoreSelecionado = n;
  $$('.escore-opt').forEach(o => o.classList.toggle('active', +o.dataset.n === n));
  atualizarEscoreInfo(n);
}
function atualizarEscoreInfo(n){
  const e = ESCORES.find(x=>x.n === n);
  if(!e) return;
  const info = $('#escoreInfo');
  if(info) info.innerHTML = `<div class="blk"><h4>${e.emoji} ${e.label}</h4><p>${esc(e.desc)}</p></div>`;
}
function salvarEscore(){
  const pet = state.pets.find(p=>p.id === state.petSelecionado);
  if(!pet) return;
  pet.escore = escoreSelecionado;
  saveDB(); closeModal(); toast('Escore salvo! ⚖️'); renderSaude();
}

  openModal(headPadrao('Como usar o PetVida', 'Guia rápido — v10.3'),
    `<div class="blk" style="background:linear-gradient(140deg,#E4F8F5,#D0F2EB);border-color:#A8E4D8">

      <p>Base com <strong>Vermi Plus (VetBras), Drontal Plus, Endogard, Bravecto Plus, Simparic Plus, NexGard Spectra</strong> e mais.</p>
    </div>
    <div class="blk" style="background:linear-gradient(140deg,#FFF9EC,#FFEFD0);border-color:#FFE4B5">
      <h4><span class="b-ic" style="background:rgba(232,155,78,.20);color:#B47800">🏆</span>Top 10 rações por pet</h4>
      <p>Na aba <strong>Rações</strong>, veja as 10 mais usadas para o porte e idade do seu pet.</p>
    </div>
    <div class="blk" style="background:linear-gradient(140deg,#F0F9FB,#E0F4F8);border-color:#C8E8EE">
      <h4><span class="b-ic" style="background:rgba(79,179,196,.20);color:#2A8A99">📏</span>Curva de crescimento</h4>
      <p>Compare o peso real do filhote com o padrão da raça/porte.</p>
    </div>
    <div class="blk warn"><h4><span class="b-ic">⚕️</span>Aviso</h4><p>Não substitui consulta veterinária.</p></div>
    <div style="text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:10px 0">PetVida <strong style="color:var(--primary-d)">${APP_VERSION}</strong> · ${APP_VERSION_DATE}</div>`,
    `<button class="btn btn-primary" onclick="closeModal()">Entendi</button>`);
}
function init(){
  loadDB();
  loadIAConfig();
  loadChatHistory();
  loadFbAuth();
  loadFbSync();
  if(state.pets.length > 0) state.petSelecionado = state.pets[0].id;
  if(state.pets.length > 0 && getBackups().length === 0) fazerBackupAutomatico('Inicial');
  $$('.page').forEach((p, idx) => p.classList.toggle('active', idx === 0));
  goTo(0);
  atualizarHeader();
  atualizarFAB();
  atualizarBadgeBackup();
  atualizarBadgeCloud();
  console.log('🐾 PetVida ' + APP_VERSION + ' iniciado');
  console.log('🪱 Vermífugo inicial: 15 dias (corrigido)');
  console.log('💊 ' + Object.keys(PRODUTOS_VERMIFUGO).length + ' vermífugos e ' + Object.keys(PRODUTOS_ANTIPULGAS).length + ' antipulgas');
  console.log('🍖 Top 10 rações por pet: ATIVO (' + RACOES_DB.length + ' rações)');
  console.log('📚 ' + RACAS.length + ' raças · ' + (DOENCAS.cao.length + DOENCAS.gato.length) + ' doenças');
  if(fbAuth.uid && navigator.onLine){
    setTimeout(()=> { sincronizarInteligente().catch(()=>{}); }, 1500);
  }
}
init();
let lastTouch = 0;
document.addEventListener('touchend', function(e){
  const now = Date.now();
  if(now <= lastTouch + 300 && !e.target.closest('.chat-input') && !e.target.closest('input') && !e.target.closest('textarea') && !e.target.closest('label')) e.preventDefault();
  lastTouch = now;
}, {passive:false});
window.addEventListener('beforeunload', saveDB);
setInterval(function(){
  if(state.pets.length > 0) fazerBackupAutomatico('Automático');
}, 30 * 60 * 1000);
</script>
